name: MathGraph blind transfer recognition ablation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raw-recognition:
    strategy:
      fail-fast: false
      matrix:
        rid:
          - evaluation_normal_0042
          - evaluation_normal_0044
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'openai>=1,<2'
      - name: Pin official Stage 2 Lean and Mathlib
        run: |
          printf '%s\n' 'leanprover/lean4:v4.32.2' > lean-toolchain
          python - <<'PY'
          from pathlib import Path
          p=Path('lakefile.lean')
          p.write_text(p.read_text().replace('896cc56a395e1615786fac56564a3fe6bfeebcc4','905b95818eb32af7874a58b427f50c1711a5e96c'))
          Path('lake-manifest.json').unlink(missing_ok=True)
          PY
      - name: Setup official-pinned judge
        env:
          SKIP_DOCKER: '1'
        run: bash scripts/setup.sh
      - name: Download normal evaluation set
        run: |
          mkdir -p /tmp/sair_eval
          curl -fL --retry 3 'https://huggingface.co/datasets/SAIRfoundation/equational-theories-selected-problems/resolve/main/data/evaluation_normal.jsonl' -o /tmp/sair_eval/evaluation_normal.jsonl
      - name: Frozen search with raw target recognition
        run: |
          source .env.judge
          python experiments/mathgraph/run_796_blind_transfer_raw_recognition.py \
            --id '${{ matrix.rid }}' \
            --input /tmp/sair_eval/evaluation_normal.jsonl \
            --frontier-seconds 30 \
            --given-seconds 10 \
            --frontier-rounds 3 \
            --given-steps 16 \
            --candidate-budget 512 \
            --behavioural-keep 512 \
            --probe-partners 64 \
            --closure-rounds 2 \
            --closure-new-per-round 128 \
            --tail-novelty-max 80 \
            --output 'experiments/mathgraph/results/796-${{ matrix.rid }}-raw-recognition-ablation.json'
      - uses: actions/upload-artifact@v4
        with:
          name: 'mathgraph-${{ matrix.rid }}-raw-recognition-ablation'
          path: 'experiments/mathgraph/results/796-${{ matrix.rid }}-raw-recognition-ablation.json'

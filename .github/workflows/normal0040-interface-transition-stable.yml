name: Normal0040 Interface Transition Stable Gate

on:
  pull_request:
    branches: [mathgraph/residual-factorization-base-20260821]
    paths:
      - 'experiments/mathgraph/.normal0040_interface_transition_trigger_20260822'
      - 'experiments/mathgraph/run_normal0040_interface_transition_gate.py'
      - 'experiments/mathgraph/protocols/normal0040-interface-transition-v1.json'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/residual-factorization-optimum-20260821
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=3,<5'
      - name: Verify frozen protocol predates executable
        run: |
          set -euo pipefail
          test "$(git rev-list --count 3ec807116ab99198456c0dd57f31e9541fbec022..0f2c12c7f081dd5358472d53b5d64d95c8e0207e)" -ge 1
          git show 3ec807116ab99198456c0dd57f31e9541fbec022:experiments/mathgraph/protocols/normal0040-interface-transition-v1.json >/dev/null
      - name: Run second-order continuation-interface transition probe
        run: python experiments/mathgraph/run_normal0040_interface_transition_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: normal0040-interface-transition-v1
          path: experiments/mathgraph/results/normal0040-interface-transition-gate.json

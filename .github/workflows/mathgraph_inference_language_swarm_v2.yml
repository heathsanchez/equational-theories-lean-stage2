name: MathGraph Inference Language Swarm V2
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:
jobs:
  swarm:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.title == '[MathGraph Trigger] Given Clause Saturation Gate')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/developmental-continuation-20260820
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=3,<5'
      - name: Run orthogonal inference-language swarm
        run: python experiments/mathgraph/run_inference_language_swarm_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-inference-language-swarm-v2
          path: experiments/mathgraph/results/inference-language-swarm-v2.json
          if-no-files-found: warn
          retention-days: 30

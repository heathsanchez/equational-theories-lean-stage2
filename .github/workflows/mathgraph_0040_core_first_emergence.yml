name: MathGraph 0040 core-first MSI emergence
on:
  push:
    branches:
      - mathgraph/residual-router-796-20260826
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-first:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'openai>=1,<2'
      - name: Pin official Stage 2 Lean and Mathlib
        run: |
          printf '%s\n' 'leanprover/lean4:v4.32.2' > lean-toolchain
          python - <<'PY'
          from pathlib import Path
          p=Path('lakefile.lean')
          p.write_text(p.read_text().replace('896cc56a395e1615786fac56564a3fe6bfeebcc4','905b95818eb32af7874a58b427f50c1711a5e96c'))
          Path('lake-manifest.json').unlink(missing_ok=True)
          PY
      - name: Setup official-pinned judge
        env:
          SKIP_DOCKER: '1'
        run: bash scripts/setup.sh
      - name: Download normal evaluation set
        run: |
          mkdir -p /tmp/sair_eval
          curl -fL --retry 3 'https://huggingface.co/datasets/SAIRfoundation/equational-theories-selected-problems/resolve/main/data/evaluation_normal.jsonl' -o /tmp/sair_eval/evaluation_normal.jsonl
      - name: Run core-first emergence
        run: |
          source .env.judge
          python experiments/mathgraph/run_796_0040_core_first_emergence.py \
            --input /tmp/sair_eval/evaluation_normal.jsonl \
            --seconds 150 \
            --seed-rounds 4 \
            --states 96 \
            --continuations 96 \
            --max-separators 24 \
            --closure-rounds 5 \
            --output experiments/mathgraph/results/796-0040-core-first-emergence.json
      - uses: actions/upload-artifact@v4
        with:
          name: mathgraph-0040-core-first-emergence
          path: experiments/mathgraph/results/796-0040-core-first-emergence.json

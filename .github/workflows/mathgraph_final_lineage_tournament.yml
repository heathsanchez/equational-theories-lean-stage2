name: MathGraph final solver lineage tournament
# trigger 2026-08-25

on:
  workflow_dispatch:
  push:
    branches:
      - mathgraph/final-lineage-tournament-20260825
    paths:
      - 'experiments/mathgraph/run_final_lineage_tournament.py'
      - '.github/workflows/mathgraph_final_lineage_tournament.yml'

jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run five-arm lineage tournament
        run: |
          set -euo pipefail
          python experiments/mathgraph/run_final_lineage_tournament.py
      - name: Show summary
        if: always()
        run: |
          cat experiments/mathgraph/results/final-lineage-tournament.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-lineage-tournament
          path: experiments/mathgraph/results/final-lineage-tournament.json

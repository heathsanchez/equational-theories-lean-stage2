name: MathGraph Five Residual Rule Handoff Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/research-triggers/five-residual-handoff.json

permissions:
  contents: read

jobs:
  final-three-797:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: evaluation_normal_0036
            split: evaluation_normal
          - rid: evaluation_order5_0014
            split: evaluation_order5
          - rid: evaluation_order5_0042
            split: evaluation_order5
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout frozen 796 research branch
        uses: actions/checkout@v4
        with:
          ref: mathgraph/residual-router-796-20260826
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'openai>=1,<2'
      - name: Pin official Stage 2 Lean and Mathlib
        run: |
          printf '%s\n' 'leanprover/lean4:v4.32.2' > lean-toolchain
          python - <<'PY'
          from pathlib import Path
          p=Path('lakefile.lean')
          p.write_text(p.read_text().replace('896cc56a395e1615786fac56564a3fe6bfeebcc4','905b95818eb32af7874a58b427f50c1711a5e96c'))
          Path('lake-manifest.json').unlink(missing_ok=True)
          PY
      - name: Setup official-pinned judge
        env:
          SKIP_DOCKER: '1'
        run: bash scripts/setup.sh
      - name: Download selected evaluation split
        run: |
          mkdir -p /tmp/sair_eval
          base='https://huggingface.co/datasets/SAIRfoundation/equational-theories-selected-problems/resolve/main/data'
          curl -fL --retry 3 "$base/${{ matrix.split }}.jsonl" -o "/tmp/sair_eval/${{ matrix.split }}.jsonl"
      - name: Run frozen 0040-derived mechanism on final residual
        run: |
          source .env.judge
          python experiments/mathgraph/run_796_blind_transfer_any_split.py \
            --id '${{ matrix.rid }}' \
            --input '/tmp/sair_eval/${{ matrix.split }}.jsonl' \
            --frontier-seconds 12 \
            --given-seconds 5 \
            --frontier-rounds 3 \
            --given-steps 16 \
            --candidate-budget 512 \
            --behavioural-keep 512 \
            --probe-partners 64 \
            --closure-rounds 2 \
            --closure-new-per-round 128 \
            --tail-novelty-max 80 \
            --output 'experiments/mathgraph/results/797-${{ matrix.rid }}-final-three-blind.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'mathgraph-797-${{ matrix.rid }}-final-three-blind'
          path: 'experiments/mathgraph/results/797-${{ matrix.rid }}-final-three-blind.json'
          if-no-files-found: ignore

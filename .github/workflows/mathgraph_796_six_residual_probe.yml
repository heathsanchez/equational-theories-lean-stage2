name: MathGraph 796 six-residual probe
on:
  push:
    branches:
      - mathgraph/residual-router-796-20260826
    paths:
      - experiments/mathgraph/run_796_six_residual_probe.py
      - .github/workflows/mathgraph_796_six_residual_probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python requirements
        run: python -m pip install -r requirements.txt
      - name: Set up Lean judge
        env:
          SKIP_DOCKER: '1'
        run: bash scripts/setup.sh
      - name: Fetch official evaluation sets
        run: |
          mkdir -p /tmp/sair_eval
          base='https://huggingface.co/datasets/SAIRfoundation/equational-theories-selected-problems/resolve/main/data'
          curl -fL --retry 3 "$base/evaluation_normal.jsonl" -o /tmp/sair_eval/evaluation_normal.jsonl
          curl -fL --retry 3 "$base/evaluation_hard.jsonl" -o /tmp/sair_eval/evaluation_hard.jsonl
          curl -fL --retry 3 "$base/evaluation_order5.jsonl" -o /tmp/sair_eval/evaluation_order5.jsonl
      - name: Run current 796 solver on historical six
        run: |
          source .env.judge
          python experiments/mathgraph/run_796_six_residual_probe.py \
            --normal /tmp/sair_eval/evaluation_normal.jsonl \
            --hard /tmp/sair_eval/evaluation_hard.jsonl \
            --order5 /tmp/sair_eval/evaluation_order5.jsonl \
            --timeout 60 \
            --output experiments/mathgraph/results/796-six-residual-probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: mathgraph-796-six-residual-probe
          path: experiments/mathgraph/results/796-six-residual-probe.json
          if-no-files-found: error

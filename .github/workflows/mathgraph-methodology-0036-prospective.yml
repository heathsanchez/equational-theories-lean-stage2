name: MathGraph Methodology 0036 Prospective Gate
on:
  push:
    branches:
      - mathgraph/methodology-0036-prospective-20260823
  pull_request:
    branches:
      - mathgraph/methodology-0036-base-20260823
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/methodology-0036-prospective-20260823
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'datasets>=3,<5'
      - name: Verify protocols predate executables
        run: |
          set -euo pipefail
          test "$(git rev-list --count 583808f7411850897a49ec271cb5adc2d272cec8..fd56588b701b4e610c2c382fe8fd30297ed75611)" -ge 1
          test "$(git rev-list --count f28ed1f30ff5c036963b08077e5f30958e24170e..cf592a846ba218f1f06924047354e1d6dc79dc16)" -ge 1
          test "$(git rev-list --count 10bc84a19eeba2f368be36921fae903268293c8e..147176edbcbaaaaeb5a33858e4a46602fc4bedca)" -ge 1
          git show 583808f7411850897a49ec271cb5adc2d272cec8:experiments/mathgraph/protocols/methodology-0036-sterility-factorization-v1.json >/dev/null
          git show f28ed1f30ff5c036963b08077e5f30958e24170e:experiments/mathgraph/protocols/methodology-0036-reentry-congruence-gate-v2.json >/dev/null
          git show 10bc84a19eeba2f368be36921fae903268293c8e:experiments/mathgraph/protocols/methodology-0036-size-compression-threshold-v1.json >/dev/null
      - name: Fetch frozen historical target-narrowing solver
        run: git fetch origin mathgraph/superposition-selector-tournament-20260820:refs/remotes/origin/mathgraph/superposition-selector-tournament-20260820
      - name: Reproduce prospective 0036 sterility factorization
        run: python experiments/mathgraph/run_methodology_0036_sterility_factorization_gate.py
      - name: Run corrected prospective 0036 re-entry plus congruence discriminator
        run: python experiments/mathgraph/run_methodology_0036_reentry_congruence_gate_v2.py
      - name: Run prospective 0036 raw-size versus macro-compression threshold
        run: python experiments/mathgraph/run_methodology_0036_size_compression_threshold.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: methodology-0036-prospective-gates-v3
          path: |
            experiments/mathgraph/results/methodology-0036-sterility-factorization-gate.json
            experiments/mathgraph/results/methodology-0036-reentry-congruence-gate-v2.json
            experiments/mathgraph/results/methodology-0036-size-compression-threshold-v1.json
          if-no-files-found: warn

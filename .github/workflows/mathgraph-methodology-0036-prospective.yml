name: MathGraph Methodology 0036 Prospective Gate
on:
  push:
    branches:
      - mathgraph/methodology-0036-prospective-20260823
  pull_request:
    branches:
      - mathgraph/methodology-0036-base-20260823
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/methodology-0036-prospective-20260823
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'datasets>=3,<5'
      - name: Verify protocols predate executables
        run: |
          set -euo pipefail
          test "$(git rev-list --count 583808f7411850897a49ec271cb5adc2d272cec8..fd56588b701b4e610c2c382fe8fd30297ed75611)" -ge 1
          test "$(git rev-list --count 88fe113f149011792041c25fbae08d6b55f32791..4a1fa1cfb82d56895abaab8ba7faba82ff4c7088)" -ge 1
          git show 583808f7411850897a49ec271cb5adc2d272cec8:experiments/mathgraph/protocols/methodology-0036-sterility-factorization-v1.json >/dev/null
          git show 88fe113f149011792041c25fbae08d6b55f32791:experiments/mathgraph/protocols/methodology-0036-reentry-gate-v1.json >/dev/null
      - name: Fetch frozen historical target-narrowing solver
        run: git fetch origin mathgraph/superposition-selector-tournament-20260820:refs/remotes/origin/mathgraph/superposition-selector-tournament-20260820
      - name: Reproduce prospective 0036 sterility factorization
        run: python experiments/mathgraph/run_methodology_0036_sterility_factorization_gate.py
      - name: Run prospective 0036 endpoint re-entry discriminator
        run: python experiments/mathgraph/run_methodology_0036_reentry_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: methodology-0036-prospective-gates
          path: |
            experiments/mathgraph/results/methodology-0036-sterility-factorization-gate.json
            experiments/mathgraph/results/methodology-0036-reentry-gate.json
          if-no-files-found: warn

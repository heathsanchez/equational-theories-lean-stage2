name: MathGraph Methodology 0036 Prospective Gate
on:
  push:
    branches:
      - mathgraph/methodology-0036-prospective-20260823
  pull_request:
    branches:
      - mathgraph/methodology-0036-base-20260823
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/methodology-0036-prospective-20260823
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'datasets>=3,<5'
      - name: Verify protocols predate executables
        run: |
          set -euo pipefail
          test "$(git rev-list --count 583808f7411850897a49ec271cb5adc2d272cec8..fd56588b701b4e610c2c382fe8fd30297ed75611)" -ge 1
          test "$(git rev-list --count f28ed1f30ff5c036963b08077e5f30958e24170e..cf592a846ba218f1f06924047354e1d6dc79dc16)" -ge 1
          test "$(git rev-list --count a5e659e251aca75f04ba46b14c0a0baf59a915b5..2faa293dea18722f09309729cf8064e7b19ad558)" -ge 1
          test "$(git rev-list --count 12daa415740eda7878d0f7fc4e2f30fb42ca2cf8..979abe7ff2ed7fa796f32270c55c83b61bb4424f)" -ge 1
          test "$(git rev-list --count 7b40682483cacde2f3f0380230bb525f8dcd41ff..b723f29b03d2a22760815d6deefa97e6214d2d2e)" -ge 1
          test "$(git rev-list --count 339efbfc46a434921c9fcfb4d1ff750f7636473b..bae69e5d2873994c34b63f7bd9b3ca47b8e7452a)" -ge 1
          test "$(git rev-list --count ec07c94cd6a015edf1a40608663e8f221a577ce0..b1131e675e1a5dc1f883e290a14a05f2533afd02)" -ge 1
          test "$(git rev-list --count b6d761c3feded2b5bf0c6a181e9972332fc20a40..a110149a56dcbe42077a98cc9ea5838aa5be5670)" -ge 1
          test "$(git rev-list --count 0a1eda936496e92bc6282438d18dea261a5aaea3..b7a0a4827ef380ab14824dcb0488dc1f19f7dfa4)" -ge 1
          test "$(git rev-list --count b3be071798babfe0da0c94096843514051896500..9b046e455501625906521f6c3a8372fd0753d7ab)" -ge 1
          test "$(git rev-list --count 895a696d1129eb9bf8774c26985a8f9b2d2606f6..b9c87377433684c5684509f7bd0450e9610122b4)" -ge 1
          test "$(git rev-list --count 7c185fa4b9315c65232898461b4621674cf1189b..558da77cb10c76509eb7da394f74177132dfedf7)" -ge 1
          test "$(git rev-list --count 8e7ed54ceb283b4a6853579f2439ad0bf7f28ffa..e118a4561e2712217c7179a9107ef65a97adff21)" -ge 1
          test "$(git rev-list --count 50d637d9618d14b4cce0ec973c674cef6b3e77aa..06cdb072d1581ab49c354a021a52323b83b9ffb8)" -ge 1
          git show 8e7ed54ceb283b4a6853579f2439ad0bf7f28ffa:experiments/mathgraph/protocols/methodology-0036-direct-plateau-depth2-v1.json >/dev/null
          git show 50d637d9618d14b4cce0ec973c674cef6b3e77aa:experiments/mathgraph/protocols/methodology-0036-plateau-invariant-v1.json >/dev/null
      - name: Fetch frozen historical target-narrowing solver
        run: git fetch origin mathgraph/superposition-selector-tournament-20260820:refs/remotes/origin/mathgraph/superposition-selector-tournament-20260820
      - name: Reproduce 0036 sterility factorization
        run: python experiments/mathgraph/run_methodology_0036_sterility_factorization_gate.py
      - name: Reproduce 0036 re-entry plus congruence discriminator
        run: python experiments/mathgraph/run_methodology_0036_reentry_congruence_gate_v2.py
      - name: Reproduce corrected raw-cap-19 overlap causal discriminator
        run: python experiments/mathgraph/run_methodology_0036_corrected_overlap_causal_v2.py
      - name: Reproduce bare-variable interface discriminator
        run: python experiments/mathgraph/run_methodology_0036_variable_interface_gate_v1.py
      - name: Reproduce synchronized-specialization diagnostic
        run: python experiments/mathgraph/run_methodology_0036_synchronized_specialization_diagnostic_v1.py
      - name: Reproduce component-cut factorization diagnostic
        run: python experiments/mathgraph/run_methodology_0036_component_cut_factorization_v1.py
      - name: Reproduce cut-ranking tournament
        run: python experiments/mathgraph/run_methodology_0036_cut_ranking_tournament_v1.py
      - name: Reproduce cut-ranking prefix discriminator
        run: python experiments/mathgraph/run_methodology_0036_cut_ranking_prefix_v1.py
      - name: Reproduce cut-ranking causal attack
        run: python experiments/mathgraph/run_methodology_0036_cut_ranking_attack_v1.py
      - name: Reproduce raw-goal graph descaffolding gate
        run: python experiments/mathgraph/run_methodology_0036_goal_cut_descaffold_v1.py
      - name: Reproduce dynamic raw-goal recursion gate
        run: python experiments/mathgraph/run_methodology_0036_dynamic_goal_cut_controller_v1.py
      - name: Reproduce post-contractor factorization diagnostic
        run: python experiments/mathgraph/run_methodology_0036_postcontractor_factorization_v1.py
      - name: Run direct-constructor plateau depth-2 gate
        run: python experiments/mathgraph/run_methodology_0036_direct_plateau_depth2_v1.py
      - name: Run separation-8 plateau invariant diagnostic
        run: python experiments/mathgraph/run_methodology_0036_plateau_invariant_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: methodology-0036-prospective-gates-v17
          path: |
            experiments/mathgraph/results/methodology-0036-sterility-factorization-gate.json
            experiments/mathgraph/results/methodology-0036-reentry-congruence-gate-v2.json
            experiments/mathgraph/results/methodology-0036-corrected-overlap-causal-v2.json
            experiments/mathgraph/results/methodology-0036-variable-interface-gate-v1.json
            experiments/mathgraph/results/methodology-0036-synchronized-specialization-diagnostic-v1.json
            experiments/mathgraph/results/methodology-0036-component-cut-factorization-v1.json
            experiments/mathgraph/results/methodology-0036-cut-ranking-tournament-v1.json
            experiments/mathgraph/results/methodology-0036-cut-ranking-prefix-v1.json
            experiments/mathgraph/results/methodology-0036-cut-ranking-attack-v1.json
            experiments/mathgraph/results/methodology-0036-goal-cut-descaffold-v1.json
            experiments/mathgraph/results/methodology-0036-dynamic-goal-cut-controller-v1.json
            experiments/mathgraph/results/methodology-0036-postcontractor-factorization-v1.json
            experiments/mathgraph/results/methodology-0036-direct-plateau-depth2-v1.json
            experiments/mathgraph/results/methodology-0036-plateau-invariant-v1.json
          if-no-files-found: warn

name: MathGraph Closure Handoff Audit

on:
  push:
    branches:
      - mathgraph/superposition-selector-tournament-20260820
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/superposition-selector-tournament-20260820
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dataset tooling
        run: python -m pip install 'datasets>=3,<5'
      - name: Build three-case TRUE audit set
        run: |
          python - <<'PY'
          import json
          from datasets import load_dataset
          wanted={'evaluation_extra_hard_0143','evaluation_extra_hard_0036','evaluation_normal_0036'}
          rows=[]
          for cfg in ['evaluation_normal','evaluation_extra_hard']:
              rows += [dict(r) for r in load_dataset('SAIRfoundation/equational-theories-selected-problems',cfg,split='train') if r.get('id') in wanted]
          if {r['id'] for r in rows} != wanted: raise SystemExit(f'missing ids: {wanted-{r["id"] for r in rows}}')
          json.dump(rows,open('/tmp/closure-audit.json','w'),indent=2)
          PY
      - name: Run closure handoff audit
        run: |
          python experiments/mathgraph/run_closure_handoff_audit.py --input /tmp/closure-audit.json --output experiments/mathgraph/results/closure-handoff-audit.json
      - name: Persist result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/mathgraph/results/closure-handoff-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(research): persist closure handoff audit [skip ci]'
          git push origin HEAD:mathgraph/superposition-selector-tournament-20260820

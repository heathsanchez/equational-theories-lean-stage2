name: MathGraph Collapse Diagnostics

on:
  push:
    branches:
      - mathgraph/perfect-solver-oracle-20260810

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Profile six residuals and locate controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util,json,sys
          from pathlib import Path
          hs=Path('experiments/mathgraph/streaming_singleton_certificate.py')
          spec=importlib.util.spec_from_file_location('ssc',hs); ssc=importlib.util.module_from_spec(spec);sys.modules[spec.name]=ssc;spec.loader.exec_module(ssc)
          m=ssc.load_solver('submissions/mathgraph/solver.py')
          inv=json.loads(Path('experiments/mathgraph/context_calculus/artifacts/phase0_inventory.json').read_text())
          rows=inv['six_unresolved']
          results=[]
          for row in rows:
              source=m.parse_equation(row['source'])
              for maxterm in (25,30):
                  for seconds in (0.05,0.10,0.25,0.50,2.50):
                      root,stats=ssc.discover_singleton(m,source,seconds,maxterm,2)
                      results.append({'id':row['id'],'maxterm':maxterm,'seconds':seconds,**stats})
                      if root is not None: break
          Path('/tmp/progress.json').write_text(json.dumps(results,indent=2)+'\n')
          candidates=[]
          for p in Path('experiments').rglob('*'):
              if p.is_file() and any(k in p.name.lower() for k in ('false','control','balanced','manifest','sample')):
                  candidates.append(str(p))
          Path('/tmp/control_files.txt').write_text('\n'.join(sorted(candidates))+'\n')
          print(json.dumps(results,indent=2))
          print('CONTROL FILES')
          print('\n'.join(sorted(candidates)[:200]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: collapse-diagnostics
          path: |
            /tmp/progress.json
            /tmp/control_files.txt

name: MathGraph 0036 CN1 Certificate Recovery

on:
  push:
    branches:
      - codex/mathgraph-0036-target-bridge-macro
    paths:
      - experiments/mathgraph/residual12/0036_cn1_certificate_recovery_preregistration.json
      - experiments/mathgraph/residual12/run_0036_cn1_certificate_recovery.py
      - .github/workflows/mathgraph_0036_cn1_certificate_recovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify frozen protocol predates recovery executable
        shell: bash
        run: |
          set -euo pipefail
          frozen=98b04bcbfc6199d73513ad9111eb442bc33063cb
          git merge-base --is-ancestor "$frozen" HEAD
          test "$(git log -1 --format=%H -- experiments/mathgraph/residual12/0036_cn1_certificate_recovery_preregistration.json)" = "$frozen"
          if git cat-file -e "$frozen:experiments/mathgraph/residual12/run_0036_cn1_certificate_recovery.py" 2>/dev/null; then
            echo "Recovery executable existed at the frozen protocol commit" >&2
            exit 1
          fi

      - name: Validate frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.32.2"
          grep -q 905b95818eb32af7874a58b427f50c1711a5e96c lake-manifest.json
          test "$(sha256sum submissions/mathgraph/solver.py | cut -d' ' -f1)" = "fc402fae046096d99a8c01a6848bc4030d282c7f4a90ff5e9c26c3c8d8833fe1"
          test "$(sha256sum experiments/mathgraph/paramodulator_control/run_forward_demodulation_ablation.py | cut -d' ' -f1)" = "6f2891c7cd23dc45699c2040b559cb2d37d40030a581d27880b1746d285375a8"
          test "$(sha256sum experiments/mathgraph/residual12/0036_cn1_certificate_recovery_preregistration.json | cut -d' ' -f1)" = "6c58b6ce9075669e09cc1dde856be800eadde1756fb5eb4a74df758135f07465"
          python -m py_compile experiments/mathgraph/residual12/run_0036_cn1_certificate_recovery.py
          python -m json.tool experiments/mathgraph/residual12/0036_cn1_certificate_recovery_preregistration.json >/dev/null

      - name: Cache Lean and Lake packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: mathgraph-0036-cn1-recovery-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Build official Lean judge
        env:
          SKIP_DOCKER: "1"
        run: bash scripts/setup.sh

      - name: Recover and officially verify the frozen CN1 certificate
        shell: bash
        run: |
          set -euo pipefail
          source .env.judge
          PYTHONDONTWRITEBYTECODE=1 python \
            experiments/mathgraph/residual12/run_0036_cn1_certificate_recovery.py \
            --official

      - name: Enforce recovery claim boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(
              "experiments/mathgraph/residual12/"
              "0036_cn1_certificate_recovery_artifacts"
          )
          result = json.loads(
              (root / "0036_cn1_certificate_recovery_results.json").read_text()
          )
          if not result["measurement_ok"] or not result["official_enabled"]:
              raise SystemExit("non-evidentiary recovery")
          if result["decision"] not in {
              "CN1_CERTIFICATE_RECOVERED", "CN1_PROOF_SHAPE_DRIFT"
          }:
              raise SystemExit(result["decision"])
          recovery = result["recovery"]
          required = {
              "status": "proved",
              "plan_ok": True,
              "independent_replay": True,
              "external_plan_replay": True,
              "lean_status": "accepted",
          }
          for key, expected in required.items():
              if recovery[key] != expected:
                  raise SystemExit(f"{key}: {recovery[key]!r}")
          for name in (
              "0036_cn1_proof.p9p",
              "0036_cn1_plan.json",
              "0036_cn1_certificate.lean",
              "0036_cn1_ancestry.json",
          ):
              if result["artifacts"][name]["bytes"] <= 0:
                  raise SystemExit(f"empty artifact: {name}")
          print(json.dumps({
              "decision": result["decision"],
              "lean_status": recovery["lean_status"],
              "proof_ancestry_nodes": recovery["proof_ancestry_nodes"],
              "proof_ancestry_superpositions": recovery[
                  "proof_ancestry_superpositions"
              ],
              "proof_ancestry_demodulations": recovery[
                  "proof_ancestry_demodulations"
              ],
              "certificate_bytes": recovery["certificate_bytes"],
          }, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-0036-cn1-certificate-recovery
          path: experiments/mathgraph/residual12/0036_cn1_certificate_recovery_artifacts
          if-no-files-found: warn
          retention-days: 30

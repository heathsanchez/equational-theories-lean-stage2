name: MathGraph Normal0040 Distance2 Site Lift Gate

on:
  push:
    branches:
      - mathgraph/binary-fusion-isolated-20260821
    paths:
      - 'experiments/mathgraph/NORMAL0040_DISTANCE2_SITE_LIFT_FREEZE_20260821.json'
      - 'experiments/mathgraph/run_normal0040_distance2_site_lift_gate.py'
      - '.github/workflows/mathgraph_normal0040_distance2_site_lift_gate.yml'
  pull_request:
    paths:
      - 'experiments/mathgraph/NORMAL0040_DISTANCE2_SITE_LIFT_FREEZE_20260821.json'
      - 'experiments/mathgraph/run_normal0040_distance2_site_lift_gate.py'
      - '.github/workflows/mathgraph_normal0040_distance2_site_lift_gate.yml'

concurrency:
  group: mathgraph-normal0040-distance2-site-lift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-lift:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=3,<5'
      - name: Run frozen distance-2 exact-context site-lift gate
        run: python experiments/mathgraph/run_normal0040_distance2_site_lift_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: mathgraph-normal0040-distance2-site-lift
          path: experiments/mathgraph/results/normal0040-distance2-site-lift-gate.json

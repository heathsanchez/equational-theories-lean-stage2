name: MathGraph 796 0040 exact given clause
on:
  push:
    branches: [mathgraph/residual-router-796-20260826]
  workflow_dispatch:
jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'openai>=1,<2'
      - name: Setup Lean judge
        env:
          SKIP_DOCKER: '1'
        run: bash scripts/setup.sh
      - name: Download official normal evaluation
        run: |
          mkdir -p /tmp/sair_eval
          curl -fL --retry 3 'https://huggingface.co/datasets/SAIRfoundation/equational-theories-selected-problems/resolve/main/data/evaluation_normal.jsonl' -o /tmp/sair_eval/evaluation_normal.jsonl
      - name: Run exact historical controller on 0040
        run: |
          source .env.judge
          python experiments/mathgraph/run_796_0040_exact_given_clause.py \
            --normal /tmp/sair_eval/evaluation_normal.jsonl \
            --seconds 30 \
            --output experiments/mathgraph/results/796-0040-exact-given-clause.json
      - uses: actions/upload-artifact@v4
        with:
          name: mathgraph-796-0040-exact-given-clause
          path: experiments/mathgraph/results/796-0040-exact-given-clause.json
          if-no-files-found: error

name: MathGraph Binary Fusion Invariant Breaker Gate
on:
  push:
    branches: [mathgraph/residual-conditioned-operator-induction-20260821]
  workflow_dispatch:
# Trigger refresh: no experimental protocol change.
jobs:
  binary-fusion:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/residual-conditioned-operator-induction-20260821
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=3,<5'
      - name: Run residual-derived binary fusion invariant breaker
        run: python experiments/mathgraph/run_binary_fusion_invariant_breaker_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-binary-fusion-invariant-breaker
          path: experiments/mathgraph/results/binary-fusion-invariant-breaker-gate.json
          if-no-files-found: warn
          retention-days: 30

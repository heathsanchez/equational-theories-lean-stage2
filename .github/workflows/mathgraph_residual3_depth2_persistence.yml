name: MathGraph residual-3 depth2 persistence
on:
  push:
    branches: [mathgraph/continuation-priority-window-20260826]
    paths:
      - 'experiments/mathgraph/run_residual3_depth2_persistence.py'
      - '.github/workflows/mathgraph_residual3_depth2_persistence.yml'
  workflow_dispatch:
jobs:
  depth2_persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m py_compile experiments/mathgraph/run_residual3_depth2_persistence.py
      - name: Run depth-2 persistence census
        run: python experiments/mathgraph/run_residual3_depth2_persistence.py
      - uses: actions/upload-artifact@v4
        with:
          name: residual3-depth2-persistence
          path: experiments/mathgraph/results/residual3-depth2-persistence.json
          if-no-files-found: error

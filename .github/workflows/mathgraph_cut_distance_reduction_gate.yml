name: MathGraph Cut Distance Reduction Gate
on:
  pull_request:
    branches: [mathgraph/isolated-actions-base-20260821]
    paths:
      - 'experiments/mathgraph/run_cut_distance_reduction_gate.py'
      - '.github/workflows/mathgraph_cut_distance_reduction_gate.yml'
jobs:
  cut-distance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'datasets>=3,<5'
      - name: Run K3 cut-distance reduction gate
        run: python experiments/mathgraph/run_cut_distance_reduction_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-cut-distance-reduction
          path: experiments/mathgraph/results/cut-distance-reduction-gate.json

name: MathGraph 18 Edge Constructor Separator

on:
  workflow_dispatch:
  push:
    branches:
      - mathgraph/18-edge-constructor-separator-20260824
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  separator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout separator branch
        uses: actions/checkout@v4
        with:
          ref: mathgraph/18-edge-constructor-separator-20260824
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Replay recovered 18-edge separator
        run: python experiments/mathgraph/run_18_edge_constructor_separator.py

      - name: Upload separator artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathgraph-18-edge-constructor-separator
          path: experiments/mathgraph/results/18-edge-constructor-separator.json
          if-no-files-found: error
          retention-days: 30

name: MathGraph Behavioural Future Integrated 800
on:
  push:
    branches:
      - mathgraph/behavioural-future-798-gate-20260831
    paths:
      - experiments/mathgraph/build_behavioural_future_specialist.py
      - .github/workflows/mathgraph_behavioural_future_integrated_800.yml
permissions:
  contents: write
jobs:
  audit-and-promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build isolated production candidate
        run: |
          python experiments/mathgraph/build_behavioural_future_specialist.py \
            --base submissions/mathgraph/solver.py \
            --output /tmp/mathgraph-behavioural-solver.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/mathgraph-behavioural-solver.py')
          s=p.read_text()
          old1='frontier_seconds = min(12.0, max(0.5, timeout / 40.0))'
          old2='given_seconds = min(5.0, max(0.5, timeout / 80.0))'
          assert s.count(old1) == 1, s.count(old1)
          assert s.count(old2) == 1, s.count(old2)
          s=s.replace(old1, 'frontier_seconds = 12.0')
          s=s.replace(old2, 'given_seconds = 5.0')
          p.write_text(s)
          PY
          cp /tmp/mathgraph-behavioural-solver.py submissions/mathgraph/solver.py
          python -m py_compile submissions/mathgraph/solver.py
          rm -rf submissions/mathgraph/__pycache__
          test "$(find submissions/mathgraph -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 1
          test "$(wc -c < submissions/mathgraph/solver.py)" -le 500000
      - name: Cache Lean and Lake packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: mathgraph-lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Setup official Lean judge
        env:
          SKIP_DOCKER: '1'
        run: bash scripts/setup.sh
      - name: Install proxy and dataset tooling
        run: python -m pip install 'openai>=1,<3' 'datasets>=3,<5'
      - name: Fetch historical residual sets
        run: |
          mkdir -p /tmp/sair_eval
          base='https://huggingface.co/datasets/SAIRfoundation/equational-theories-selected-problems/resolve/main/data'
          curl -fL --retry 3 "$base/evaluation_normal.jsonl" -o /tmp/sair_eval/evaluation_normal.jsonl
          curl -fL --retry 3 "$base/evaluation_hard.jsonl" -o /tmp/sair_eval/evaluation_hard.jsonl
          curl -fL --retry 3 "$base/evaluation_order5.jsonl" -o /tmp/sair_eval/evaluation_order5.jsonl
      - name: Fast causal gate on historical six
        shell: bash
        run: |
          set -euo pipefail
          source .env.judge
          python experiments/mathgraph/run_796_six_residual_probe.py \
            --normal /tmp/sair_eval/evaluation_normal.jsonl \
            --hard /tmp/sair_eval/evaluation_hard.jsonl \
            --order5 /tmp/sair_eval/evaluation_order5.jsonl \
            --timeout 180 \
            --output experiments/mathgraph/results/behavioural-future-six.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('experiments/mathgraph/results/behavioural-future-six.json')
          d=json.loads(p.read_text())
          solved=set(d['solved'])
          required={
              'evaluation_hard_0196',
              'evaluation_normal_0036',
              'evaluation_normal_0040',
              'evaluation_normal_0158',
          }
          if not required <= solved:
              raise SystemExit(f'causal gate failed; missing {sorted(required-solved)}; solved={sorted(solved)}')
          print('BEHAVIOURAL_FUTURE_CAUSAL_GATE', json.dumps(d, sort_keys=True))
          PY
      - name: Run candidate on all 800 through official proxy and Lean
        shell: bash
        run: |
          set -euo pipefail
          source .env.judge
          python - <<'PY'
          import json,time
          from collections import Counter
          from pathlib import Path
          from datasets import load_dataset
          from pipeline.proxy import load_config,run_solver
          CONFIGS=['evaluation_normal','evaluation_hard','evaluation_extra_hard','evaluation_order5']
          OUT=Path('experiments/mathgraph/results/behavioural-future-integrated-800.json')
          cfg=load_config(); cfg['solver']['timeout_seconds']=180; cfg['judge']['lean_timeout_seconds']=90; cfg['sandbox']['mode']='none'
          rows=[]; started=time.monotonic(); submission=Path('submissions/mathgraph')
          for ds_cfg in CONFIGS:
              for raw in load_dataset('SAIRfoundation/equational-theories-selected-problems',ds_cfg,split='train'):
                  r=dict(raw)
                  problem={k:r[k] for k in r if k not in ('truth','label','is_true')}
                  result=run_solver(submission,problem,cfg)
                  rows.append({'config':ds_cfg,'id':r.get('id'),'truth':r.get('truth',r.get('label',r.get('is_true'))),'solved':bool(result.get('solved')),'verdict':result.get('verdict'),'judge_calls':result.get('judge_calls',0),'llm_calls':result.get('llm_calls',0)})
                  print(ds_cfg,r.get('id'),'solved=',result.get('solved'),'verdict=',result.get('verdict'),flush=True)
          solved=[r for r in rows if r['solved']]
          unsolved=[r for r in rows if not r['solved']]
          out={'schema':'mathgraph.behavioural-future-integrated-800.v1','total':len(rows),'solved':len(solved),'unsolved_count':len(unsolved),'unsolved_ids':[r['id'] for r in unsolved],'verdict_counts':dict(Counter(r['verdict'] for r in solved)),'judge_calls':sum(r['judge_calls'] for r in rows),'llm_calls':sum(r['llm_calls'] for r in rows),'elapsed_seconds':round(time.monotonic()-started,3),'rows':rows}
          OUT.parent.mkdir(parents=True,exist_ok=True); OUT.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('BEHAVIOURAL_FUTURE_800_SUMMARY',json.dumps({k:out[k] for k in ('total','solved','unsolved_count','unsolved_ids','verdict_counts','judge_calls','llm_calls','elapsed_seconds')},sort_keys=True))
          if out['total'] != 800: raise SystemExit(f'expected 800 rows, got {out["total"]}')
          if out['solved'] < 798: raise SystemExit(f'promotion gate failed: expected >=798, got {out["solved"]}')
          if out['llm_calls'] != 0: raise SystemExit('deterministic solver unexpectedly called an LLM')
          PY
      - name: Promote the single-file solver after the official gate
        shell: bash
        run: |
          set -euo pipefail
          git add submissions/mathgraph/solver.py
          if git diff --cached --quiet; then
            echo 'No production diff to promote'
            exit 0
          fi
          git config user.name 'MathGraph CI'
          git config user.email '32909488+heathsanchez@users.noreply.github.com'
          git commit -m 'Promote behavioural-future Stage 2 fallback [skip ci]'
          git push origin HEAD:mathgraph/behavioural-future-798-gate-20260831
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-behavioural-future-integrated-800
          path: |
            experiments/mathgraph/results/behavioural-future-six.json
            experiments/mathgraph/results/behavioural-future-integrated-800.json
          if-no-files-found: warn
          retention-days: 30

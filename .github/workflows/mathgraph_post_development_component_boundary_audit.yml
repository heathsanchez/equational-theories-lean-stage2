name: MathGraph Post Development Component Boundary Audit
on:
  push:
    branches: [mathgraph/binary-fusion-isolated-20260821]
  pull_request:
    branches: [mathgraph/residual-conditioned-operator-induction-20260821]
  workflow_dispatch:
jobs:
  boundary-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=3,<5'
      - run: python experiments/mathgraph/run_post_development_component_boundary_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-post-development-component-boundary-audit
          path: experiments/mathgraph/results/post-development-component-boundary-audit.json
          if-no-files-found: warn
          retention-days: 30

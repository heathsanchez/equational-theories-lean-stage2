name: MathGraph uploaded Marathon order5 fast census

on:
  push:
    branches:
      - mathgraph/stage2-gemma-5-errors-v1
    paths:
      - .github/workflows/mathgraph_uploaded_marathon_order5_fast_census.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    name: Order5 shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/stage2-gemma-5-errors-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'openai>=1,<2'
      - name: Reconstruct exact uploaded Marathon solver
        run: |
          rm -rf /tmp/marathon_solver && mkdir -p /tmp/marathon_solver
          python experiments/mathgraph/reconstruct_uploaded_marathon.py \
            --source submissions/mathgraph_solo_hybrid/solver.py \
            --output /tmp/marathon_solver/solver.py \
            --max-output-tokens 65536
          test "$(sha256sum /tmp/marathon_solver/solver.py | awk '{print $1}')" = '3d6e5848b615af7ee7565e33a8ef835f3454a1094fce8a6dc346a96e9795235f'
      - name: Fetch ten Order5 rows
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p /tmp/eval
          curl -fL --retry 3 'https://huggingface.co/datasets/SAIRfoundation/equational-theories-selected-problems/resolve/main/data/stage2_evaluation_main.jsonl' -o /tmp/eval/all.jsonl
          python - <<'PY'
          import json, os
          rows=[json.loads(x) for x in open('/tmp/eval/all.jsonl') if x.strip()]
          rows=[r for r in rows if r.get('difficulty')=='order5_normal']
          s=int(os.environ['SHARD']); rows=rows[s*10:(s+1)*10]
          assert len(rows)==10
          with open('/tmp/eval/shard.jsonl','w') as f:
              for r in rows: f.write(json.dumps(r,separators=(',',':'))+'\n')
          print([r['id'] for r in rows])
          PY
      - name: Start fake successful upstream
        run: |
          cat > /tmp/stub.py <<'PY'
          import json,time
          from http.server import BaseHTTPRequestHandler,ThreadingHTTPServer
          class H(BaseHTTPRequestHandler):
              def log_message(self,*a): pass
              def do_POST(self):
                  n=int(self.headers.get('Content-Length','0')); raw=self.rfile.read(n)
                  try:r=json.loads(raw)
                  except:r={}
                  with open('/tmp/requests.jsonl','a') as f:f.write(json.dumps({'max_tokens':r.get('max_tokens'),'model':r.get('model')})+'\n')
                  chars=sum(len(m.get('content','')) for m in r.get('messages',[]) if isinstance(m,dict) and isinstance(m.get('content',''),str))
                  pt=max(1,chars//4)
                  b=json.dumps({'id':'stub','object':'chat.completion','created':int(time.time()),'model':r.get('model','stub'),'choices':[{'index':0,'message':{'role':'assistant','content':'{}'},'finish_reason':'stop'}],'usage':{'prompt_tokens':pt,'completion_tokens':1,'total_tokens':pt+1}}).encode()
                  self.send_response(200);self.send_header('Content-Type','application/json');self.send_header('Content-Length',str(len(b)));self.end_headers();self.wfile.write(b)
          ThreadingHTTPServer(('127.0.0.1',18080),H).serve_forever()
          PY
          : >/tmp/requests.jsonl
          python /tmp/stub.py >/tmp/stub.out 2>/tmp/stub.err &
          sleep 1
      - name: Run exact Marathon shard
        env:
          OPENAI_BASE_URL: http://127.0.0.1:18080/v1
          OPENROUTER_API_KEY: dummy
        run: |
          rm -rf /tmp/run
          python scripts/run_marathon.py --solver /tmp/marathon_solver --manifest /tmp/eval/shard.jsonl --budget-seconds 3000 --budget-tokens 327680 --output-dir /tmp/run --no-score
      - name: Summarize
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          rows=[json.loads(x) for x in Path('/tmp/eval/shard.jsonl').read_text().splitlines() if x.strip()]
          ans=[]
          p=Path('/tmp/run/answers.jsonl')
          if p.exists():
              for x in p.read_text().splitlines():
                  try:ans.append(json.loads(x))
                  except:pass
          ids={a.get('id') for a in ans if a.get('id')}
          req=Path('/tmp/requests.jsonl').read_text().splitlines() if Path('/tmp/requests.jsonl').exists() else []
          residual=[r['id'] for r in rows if r['id'] not in ids]
          d={'shard':int(os.environ['SHARD']),'answers':len(ids),'residual':residual,'residual_count':len(residual),'llm_requests':len(req),'all_residuals_reached_llm':len(req)==len(residual)}
          Path('/tmp/census.json').write_text(json.dumps(d,indent=2)+'\n')
          print('ORDER5_FAST_CENSUS',json.dumps(d,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: order5-fast-census-${{ matrix.shard }}
          path: |
            /tmp/census.json
            /tmp/run/answers.jsonl
            /tmp/requests.jsonl
          if-no-files-found: warn

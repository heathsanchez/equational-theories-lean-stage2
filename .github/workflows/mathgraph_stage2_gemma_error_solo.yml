name: MathGraph Stage2 Gemma Solo five errors

on:
  push:
    branches:
      - mathgraph/stage2-gemma-5-errors-v1
    paths:
      - .github/workflows/mathgraph_stage2_gemma_error_solo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Restore exact submitted Solo solver
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Reconstruct and verify exact submitted Solo solver
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import zlib

          payload_dir = Path("experiments/mathgraph/payload")
          parts = sorted(payload_dir.glob("stage2_solo_solver.zlib.b64.part*"))
          if [p.name for p in parts] != [
              f"stage2_solo_solver.zlib.b64.part{i:02d}" for i in range(9)
          ]:
              raise SystemExit(f"unexpected payload parts: {[p.name for p in parts]}")

          encoded = "".join(p.read_text().strip() for p in parts)
          solver = zlib.decompress(base64.b64decode(encoded))
          digest = hashlib.sha256(solver).hexdigest()

          if len(solver) != 423718:
              raise SystemExit(f"wrong solver size: {len(solver)}")
          if digest != "42c96092bad4b03ce13ab80df927675b65ab65225bff1d971ff328949a6ef7f4":
              raise SystemExit(f"wrong solver sha256: {digest}")

          target = Path("submissions/mathgraph_solo_hybrid/solver.py")
          target.write_bytes(solver)
          print(f"restored {target}: {len(solver)} bytes sha256={digest}")
          PY
          python -m py_compile submissions/mathgraph_solo_hybrid/solver.py
      - name: Commit exact solver bytes to branch
        run: |
          if git diff --quiet -- submissions/mathgraph_solo_hybrid/solver.py; then
            echo "Exact solver already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submissions/mathgraph_solo_hybrid/solver.py
          git commit -m "Restore exact submitted Stage2 Solo solver"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  solo:
    name: Gemma Solo position ${{ matrix.position }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        position: [1, 3, 11, 34, 41, 50]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependency used by pipeline proxy
        run: python -m pip install 'openai>=1,<2'
      - name: Pin official Lean and Mathlib in CI workspace
        run: |
          printf '%s\n' 'leanprover/lean4:v4.32.2' > lean-toolchain
          python - <<'PY'
          from pathlib import Path
          p = Path('lakefile.lean')
          s = p.read_text()
          old = '896cc56a395e1615786fac56564a3fe6bfeebcc4'
          new = '905b95818eb32af7874a58b427f50c1711a5e96c'
          if old not in s:
              raise SystemExit('expected old Mathlib pin not found')
          p.write_text(s.replace(old, new))
          PY
          rm -f lake-manifest.json
      - name: Set up exact official Lean judge
        env:
          SKIP_DOCKER: '1'
        run: bash scripts/setup.sh
      - name: Confirm exact judge pins
        run: |
          source .env.judge
          lean --version
          grep -n '905b95818eb32af7874a58b427f50c1711a5e96c' lake-manifest.json
      - name: Fetch public Stage 2 main evaluation
        run: |
          mkdir -p /tmp/sair_eval
          base='https://huggingface.co/datasets/SAIRfoundation/equational-theories-selected-problems/resolve/main/data'
          curl -fL --retry 3 "$base/stage2_stress_test.jsonl" -o /tmp/sair_eval/stage2_stress_test.jsonl
      - name: Verify exact submitted Solo solver
        run: |
          test "$(wc -c < submissions/mathgraph_solo_hybrid/solver.py)" -eq 423718
          test "$(sha256sum submissions/mathgraph_solo_hybrid/solver.py | awk '{print $1}')" = '42c96092bad4b03ce13ab80df927675b65ab65225bff1d971ff328949a6ef7f4'
          python -m py_compile submissions/mathgraph_solo_hybrid/solver.py
      - name: Replay Gemma Solo
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          source .env.judge
          python experiments/mathgraph/run_stage2_gemma_error_solo.py \
            --dataset /tmp/sair_eval/stage2_stress_test.jsonl \
            --position '${{ matrix.position }}' \
            --timeout 3600 \
            --output "experiments/mathgraph/results/stage2-gemma-solo-${{ matrix.position }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage2-gemma-solo-${{ matrix.position }}
          path: experiments/mathgraph/results/stage2-gemma-solo-${{ matrix.position }}.json
          if-no-files-found: warn

name: MathGraph Stage2 Gemma Solo five errors

on:
  push:
    branches:
      - mathgraph/stage2-gemma-5-errors-v1
    paths:
      - .github/workflows/mathgraph_stage2_gemma_error_solo.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solo:
    name: Gemma Solo position ${{ matrix.position }}
    strategy:
      fail-fast: false
      matrix:
        position: [1, 3, 11, 34, 41, 50]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependency used by pipeline proxy
        run: python -m pip install 'openai>=1,<2'
      - name: Pin official Lean and Mathlib in CI workspace
        run: |
          printf '%s\n' 'leanprover/lean4:v4.32.2' > lean-toolchain
          python - <<'PY'
          from pathlib import Path
          p = Path('lakefile.lean')
          s = p.read_text()
          old = '896cc56a395e1615786fac56564a3fe6bfeebcc4'
          new = '905b95818eb32af7874a58b427f50c1711a5e96c'
          if old not in s:
              raise SystemExit('expected old Mathlib pin not found')
          p.write_text(s.replace(old, new))
          PY
          rm -f lake-manifest.json
      - name: Set up exact official Lean judge
        env:
          SKIP_DOCKER: '1'
        run: bash scripts/setup.sh
      - name: Confirm exact judge pins
        run: |
          lean --version
          grep -n '905b95818eb32af7874a58b427f50c1711a5e96c' lake-manifest.json
      - name: Fetch public Stage 2 main evaluation
        run: |
          mkdir -p /tmp/sair_eval
          base='https://huggingface.co/datasets/SAIRfoundation/equational-theories-selected-problems/resolve/main/data'
          curl -fL --retry 3 "$base/stage2_stress_test.jsonl" -o /tmp/sair_eval/stage2_stress_test.jsonl
      - name: Verify exact submitted Solo solver
        run: |
          test "$(wc -c < submissions/mathgraph_solo_hybrid/solver.py)" -eq 423718
          test "$(sha256sum submissions/mathgraph_solo_hybrid/solver.py | awk '{print $1}')" = '42c96092bad4b03ce13ab80df927675b65ab65225bff1d971ff328949a6ef7f4'
          python -m py_compile submissions/mathgraph_solo_hybrid/solver.py
      - name: Replay Gemma Solo
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          source .env.judge
          python experiments/mathgraph/run_stage2_gemma_error_solo.py \
            --dataset /tmp/sair_eval/stage2_stress_test.jsonl \
            --position '${{ matrix.position }}' \
            --timeout 3600 \
            --output "experiments/mathgraph/results/stage2-gemma-solo-${{ matrix.position }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage2-gemma-solo-${{ matrix.position }}
          path: experiments/mathgraph/results/stage2-gemma-solo-${{ matrix.position }}.json
          if-no-files-found: warn

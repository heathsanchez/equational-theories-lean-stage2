name: MathGraph 796 official 4.32.2 probe
on:
  push:
    branches:
      - mathgraph/residual-router-796-20260826
    paths:
      - .github/workflows/mathgraph_796_official_4322_probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependency used by pipeline proxy
        run: python -m pip install 'openai>=1,<2'
      - name: Pin official Lean and Mathlib in CI workspace
        run: |
          printf '%s\n' 'leanprover/lean4:v4.32.2' > lean-toolchain
          python - <<'PY'
          from pathlib import Path
          p = Path('lakefile.lean')
          s = p.read_text()
          old = '896cc56a395e1615786fac56564a3fe6bfeebcc4'
          new = '905b95818eb32af7874a58b427f50c1711a5e96c'
          if old not in s:
              raise SystemExit('expected old Mathlib pin not found')
          p.write_text(s.replace(old, new))
          PY
          rm -f lake-manifest.json
      - name: Set up exact official Lean judge
        env:
          SKIP_DOCKER: '1'
        run: bash scripts/setup.sh
      - name: Confirm exact judge pins
        run: |
          lean --version
          grep -n '905b95818eb32af7874a58b427f50c1711a5e96c' lake-manifest.json
      - name: Fetch public calibration evaluation sets
        run: |
          mkdir -p /tmp/sair_eval
          base='https://huggingface.co/datasets/SAIRfoundation/equational-theories-selected-problems/resolve/main/data'
          curl -fL --retry 3 "$base/evaluation_normal.jsonl" -o /tmp/sair_eval/evaluation_normal.jsonl
          curl -fL --retry 3 "$base/evaluation_hard.jsonl" -o /tmp/sair_eval/evaluation_hard.jsonl
          curl -fL --retry 3 "$base/evaluation_order5.jsonl" -o /tmp/sair_eval/evaluation_order5.jsonl
      - name: Run current 796 solver on historical six under official judge
        run: |
          source .env.judge
          python experiments/mathgraph/run_796_six_residual_probe.py \
            --normal /tmp/sair_eval/evaluation_normal.jsonl \
            --hard /tmp/sair_eval/evaluation_hard.jsonl \
            --order5 /tmp/sair_eval/evaluation_order5.jsonl \
            --timeout 60 \
            --output experiments/mathgraph/results/796-six-residual-official-4322.json
      - uses: actions/upload-artifact@v4
        with:
          name: mathgraph-796-six-residual-official-4322
          path: experiments/mathgraph/results/796-six-residual-official-4322.json
          if-no-files-found: error

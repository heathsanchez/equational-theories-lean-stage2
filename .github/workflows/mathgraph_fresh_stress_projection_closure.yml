name: MathGraph fresh stress projection closure

on:
  push:
    branches: [mathgraph/fresh-stress-projection-closure-20260831]
    paths:
      - '.github/workflows/mathgraph_fresh_stress_projection_closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONHASHSEED: '0'
      OFFICIAL_REPO_SHA: 817a4653bf762584931d49c6714c9fcfab7df66a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build deterministic generic candidate
        run: |
          set -euo pipefail
          python experiments/mathgraph/build_projection_closure_specialist.py \
            --base submissions/mathgraph/solver.py --output /tmp/solver.py
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/solver.py'); s = p.read_text()
          a = 'frontier_seconds = min(12.0, max(0.5, timeout / 40.0))'
          b = 'given_seconds = min(5.0, max(0.5, timeout / 80.0))'
          assert s.count(a) == 1 and s.count(b) == 1
          p.write_text(s.replace(a, 'frontier_seconds = 30.0').replace(b, 'given_seconds = 10.0'))
          PY
          python experiments/mathgraph/determinize_solver_order.py /tmp/solver.py
          python -m py_compile /tmp/solver.py
          rm -rf /tmp/__pycache__
          echo "candidate_sha256=$(sha256sum /tmp/solver.py | awk '{print $1}')"
          echo "candidate_bytes=$(wc -c < /tmp/solver.py | tr -d ' ')"
          test "$(wc -c < /tmp/solver.py | tr -d ' ')" -le 500000
      - name: Checkout pinned official harness
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/SAIRcompetition/equational-theories-lean-stage2.git /tmp/official
          cd /tmp/official
          git checkout "$OFFICIAL_REPO_SHA"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.33.1'
          grep -q '0df444a360eaa60ab8c11dca51a86af692955474' lake-manifest.json
          mkdir -p submissions/mathgraph_projection
          cp /tmp/solver.py submissions/mathgraph_projection/solver.py
      - name: Setup official Lean 4.33.1 judge
        working-directory: /tmp/official
        env:
          SKIP_DOCKER: '1'
        run: bash scripts/setup.sh
      - name: Install proxy dependency
        working-directory: /tmp/official
        run: python -m pip install 'openai>=1,<3'
      - name: Fetch stress row
        run: |
          set -euo pipefail
          curl -fL --retry 4 \
            'https://huggingface.co/datasets/SAIRfoundation/equational-theories-selected-problems/resolve/main/data/stage2_stress_test.jsonl' \
            -o /tmp/stage2_stress_test.jsonl
          test "$(wc -l < /tmp/stage2_stress_test.jsonl | tr -d ' ')" = '200'
      - name: Require fresh residual Lean acceptance
        working-directory: /tmp/official
        shell: bash
        run: |
          set -euo pipefail
          source .env.judge
          python - <<'PY'
          import json, sys, time
          from pathlib import Path
          ROOT = Path('/tmp/official'); sys.path.insert(0, str(ROOT))
          from pipeline.proxy import load_config, load_problems, run_solver
          rows = {r['id']: r for r in load_problems('/tmp/stage2_stress_test.jsonl')}
          row = rows['order5_normal_0036']
          assert row['eq1_id'] == 6543 and row['eq2_id'] == 29450 and row['answer'] is True
          cfg = load_config()
          assert cfg['solver']['timeout_seconds'] == 3600
          assert cfg['judge']['lean_timeout_seconds'] == 300
          cfg.setdefault('sandbox', {})['mode'] = 'none'
          trace = []; t0 = time.monotonic()
          result = run_solver(
              ROOT / 'submissions/mathgraph_projection', row, cfg,
              trace_hook=lambda e: trace.append(e),
          )
          judges = [x for x in trace if x.get('type') == 'judge']
          statuses = [(x.get('response') or {}).get('status') for x in judges]
          out = {
              'id': row['id'], 'eq1_id': row['eq1_id'], 'eq2_id': row['eq2_id'],
              'elapsed': round(time.monotonic() - t0, 3),
              'solved': bool(result.get('solved')), 'verdict': result.get('verdict'),
              'judge_calls': result.get('judge_calls', 0),
              'judge_statuses': statuses, 'llm_calls': result.get('llm_calls', 0),
          }
          print('FRESH_PROJECTION_CLOSURE', json.dumps(out, sort_keys=True), flush=True)
          if not out['solved'] or out['verdict'] != 'true':
              raise SystemExit('fresh residual not solved')
          if statuses != ['accepted']:
              raise SystemExit(f'expected one accepted judge call, got {statuses}')
          if out['llm_calls'] != 0:
              raise SystemExit('unexpected LLM call')
          print('FRESH_PROJECTION_CLOSURE_PASS')
          PY

name: Normal0040 Common Specialization Matrix Stable Gate
on:
  pull_request:
    branches: [mathgraph/residual-factorization-base-20260821]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/residual-factorization-optimum-20260821
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=3,<5'
      - name: Verify frozen protocol predates executable
        run: |
          set -euo pipefail
          test "$(git rev-list --count 5d29dad6dcc5f316837f901f422e6e3d1a435b85..5a67f27e0a82b5ad7a0b9d1d958535df1ba9ec81)" -ge 1
          git show 5d29dad6dcc5f316837f901f422e6e3d1a435b85:experiments/mathgraph/protocols/normal0040-common-specialization-matrix-v1.json >/dev/null
      - name: Run common-specialization matrix diagnostic
        run: python experiments/mathgraph/run_normal0040_common_specialization_matrix_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: normal0040-common-specialization-matrix-v1
          path: experiments/mathgraph/results/normal0040-common-specialization-matrix-gate.json

name: MathGraph 18 Edge Lineage Reentry

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - experiments/mathgraph/run_18_edge_lineage_reentry.py
      - .github/workflows/mathgraph_18_edge_lineage_reentry.yml

permissions:
  contents: read

jobs:
  lineage-reentry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout separator branch
        uses: actions/checkout@v4
        with:
          ref: mathgraph/18-edge-constructor-separator-20260824
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run lineage-conditioned reentry separator
        run: python experiments/mathgraph/run_18_edge_lineage_reentry.py
      - name: Upload lineage artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathgraph-18-edge-lineage-reentry
          path: experiments/mathgraph/results/18-edge-lineage-reentry.json
          if-no-files-found: error
          retention-days: 30

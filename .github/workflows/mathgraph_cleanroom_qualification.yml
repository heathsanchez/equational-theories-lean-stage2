name: MathGraph Cleanroom Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - codex/mathgraph-cleanroom-github-qualification

permissions:
  contents: read

jobs:
  focused-official-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify official toolchain pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.32.2"
          grep -q 905b95818eb32af7874a58b427f50c1711a5e96c lake-manifest.json
      - name: Install Python qualification tools
        run: python -m pip install 'pytest>=8,<9' 'datasets>=3,<5' 'openai>=1,<3'
      - name: Run cleanroom unit and provenance gates
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest -q \
            tests/test_mathgraph_cleanroom_generalization.py \
            tests/test_mathgraph_cleanroom_finite_search.py \
            tests/test_mathgraph_final_portfolio.py
      - name: Cache Lean and Lake packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: mathgraph-cleanroom-lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Build official Lean judge
        env:
          SKIP_DOCKER: "1"
        run: bash scripts/setup.sh
      - name: Run six-residual official Lean gate
        shell: bash
        run: |
          set -euo pipefail
          source .env.judge
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from pipeline.proxy import load_config, run_solver

          input_path = Path("colab/data/six_residuals.json")
          rows = json.loads(input_path.read_text(encoding="utf-8"))
          expected_columns = {
              "id", "index", "difficulty", "eq1_id", "eq2_id",
              "equation1", "equation2", "answer",
          }
          if not rows or not expected_columns <= set(rows[0]):
              raise SystemExit("unexpected six-residual schema")
          diagnostic_ids = {
              "evaluation_hard_0196",
              "evaluation_normal_0040",
              "evaluation_normal_0158",
          }
          rows = [row for row in rows if row["id"] in diagnostic_ids]

          config = load_config()
          config["solver"]["timeout_seconds"] = 120
          config["judge"]["lean_timeout_seconds"] = 90
          config["sandbox"]["mode"] = "none"
          submission = Path("submissions/mathgraph_cleanroom")
          results = []
          started = time.monotonic()
          for row in rows:
              problem = {
                  key: value for key, value in row.items()
                  if key != "answer"
              }
              result = run_solver(submission, problem, config)
              judge_responses = [
                  event.get("response") for event in result.get("log", [])
                  if event.get("type") == "judge"
              ]
              results.append({
                  "id": row["id"],
                  "expected": row["answer"],
                  "solved": bool(result.get("solved")),
                  "verdict": result.get("verdict"),
                  "judge_calls": result.get("judge_calls", 0),
                  "llm_calls": result.get("llm_calls", 0),
                  "judge_responses": judge_responses,
                  "last_log": (result.get("log") or [None])[-1],
              })
              print(results[-1], flush=True)

          accepted = {row["id"] for row in results if row["solved"]}
          required = diagnostic_ids
          output = {
              "schema": "mathgraph.cleanroom-six-official-lean.v1",
              "lean_toolchain": Path("lean-toolchain").read_text().strip(),
              "total": len(results),
              "solved": len(accepted),
              "required": sorted(required),
              "missing_required": sorted(required - accepted),
              "llm_calls": sum(row["llm_calls"] for row in results),
              "elapsed_seconds": round(time.monotonic() - started, 3),
              "rows": results,
          }
          output_path = Path(
              "experiments/mathgraph/results/cleanroom-six-official-lean.json"
          )
          output_path.write_text(
              json.dumps(output, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(output, indent=2), flush=True)
          if output["missing_required"]:
              raise SystemExit("required cleanroom proof certificates did not pass")
          if output["llm_calls"] != 0:
              raise SystemExit("deterministic qualification unexpectedly called a model")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-cleanroom-six-official-lean
          path: experiments/mathgraph/results/cleanroom-six-official-lean.json
          if-no-files-found: error
          retention-days: 30

  full-800-official-audit:
    needs: focused-official-lean
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install evaluation tooling
        run: python -m pip install 'datasets>=3,<5' 'openai>=1,<3'
      - name: Cache Lean and Lake packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: mathgraph-cleanroom-lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Build official Lean judge
        env:
          SKIP_DOCKER: "1"
        run: bash scripts/setup.sh
      - name: Run cleanroom core on all released 800 problems
        shell: bash
        run: |
          set -euo pipefail
          source .env.judge
          python - <<'PY'
          import json
          import time
          from collections import Counter
          from pathlib import Path
          from datasets import load_dataset
          from pipeline.proxy import load_config, run_solver

          configurations = (
              "evaluation_normal",
              "evaluation_hard",
              "evaluation_extra_hard",
              "evaluation_order5",
          )
          config = load_config()
          config["solver"]["timeout_seconds"] = 120
          config["judge"]["lean_timeout_seconds"] = 90
          config["sandbox"]["mode"] = "none"
          submission = Path("submissions/mathgraph_cleanroom")
          rows = []
          started = time.monotonic()
          for dataset_name in configurations:
              dataset = load_dataset(
                  "SAIRfoundation/equational-theories-selected-problems",
                  dataset_name,
                  split="train",
              )
              columns = list(dataset.column_names)
              required = {"id", "equation1", "equation2"}
              if not required <= set(columns):
                  raise SystemExit(
                      f"unexpected columns for {dataset_name}: {columns}"
                  )
              print(dataset_name, "columns=", columns, flush=True)
              for raw in dataset:
                  record = dict(raw)
                  problem = {
                      key: value for key, value in record.items()
                      if key not in {"truth", "label", "is_true", "answer"}
                  }
                  result = run_solver(submission, problem, config)
                  row = {
                      "configuration": dataset_name,
                      "id": record.get("id"),
                      "solved": bool(result.get("solved")),
                      "verdict": result.get("verdict"),
                      "judge_calls": result.get("judge_calls", 0),
                      "llm_calls": result.get("llm_calls", 0),
                  }
                  rows.append(row)
                  print(row, flush=True)

          solved = [row for row in rows if row["solved"]]
          unsolved = [row for row in rows if not row["solved"]]
          output = {
              "schema": "mathgraph.cleanroom-800-official-audit.v1",
              "lean_toolchain": Path("lean-toolchain").read_text().strip(),
              "total": len(rows),
              "solved": len(solved),
              "unsolved_count": len(unsolved),
              "unsolved_ids": [row["id"] for row in unsolved],
              "verdict_counts": dict(Counter(row["verdict"] for row in solved)),
              "judge_calls": sum(row["judge_calls"] for row in rows),
              "llm_calls": sum(row["llm_calls"] for row in rows),
              "elapsed_seconds": round(time.monotonic() - started, 3),
              "rows": rows,
          }
          output_path = Path(
              "experiments/mathgraph/results/cleanroom-800-official-audit.json"
          )
          output_path.write_text(
              json.dumps(output, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              key: output[key] for key in (
                  "total", "solved", "unsolved_count", "unsolved_ids",
                  "verdict_counts", "judge_calls", "llm_calls",
                  "elapsed_seconds",
              )
          }, indent=2), flush=True)
          if output["total"] != 800:
              raise SystemExit("released audit did not contain 800 rows")
          if output["solved"] < 777:
              raise SystemExit("cleanroom regression gate fell below 777/800")
          if output["llm_calls"] != 0:
              raise SystemExit("deterministic audit unexpectedly called a model")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-cleanroom-800-official-audit
          path: experiments/mathgraph/results/cleanroom-800-official-audit.json
          if-no-files-found: error
          retention-days: 30

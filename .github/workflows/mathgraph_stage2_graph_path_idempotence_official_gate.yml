name: MathGraph graph path idempotence official gate
on:
  push:
    branches: [mathgraph/stress-0036-residual-20260831]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-idempotence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      FROZEN_SHA256: f039604f35f03b9c2caf20226e54250777653554093443d205fd2fcd9558f404
      STRESS_SHA256: 7e8e9be1b1f0dc32b492473dd5b5ef1d6850a321f5d16dcf63ba81c94a5ffc41
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache Lean and Lake packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: mathgraph-lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Setup official Lean judge
        env:
          SKIP_DOCKER: '1'
        run: bash scripts/setup.sh
      - name: Build exact frozen solver
        shell: bash
        run: |
          set -euo pipefail
          python experiments/mathgraph/build_behavioural_future_specialist.py --base submissions/mathgraph/solver.py --output /tmp/solver.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/solver.py'); s=p.read_text()
          a='frontier_seconds = min(12.0, max(0.5, timeout / 40.0))'
          b='given_seconds = min(5.0, max(0.5, timeout / 80.0))'
          assert s.count(a)==1 and s.count(b)==1
          p.write_text(s.replace(a,'frontier_seconds = 30.0').replace(b,'given_seconds = 10.0'))
          PY
          python experiments/mathgraph/determinize_solver_order.py /tmp/solver.py
          test "$(sha256sum /tmp/solver.py | awk '{print $1}')" = "$FROZEN_SHA256"
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/solver.py'); s=p.read_text()
          old='    return "\\n".join(lines) + "\\n", len(ordered)'
          new='    return "\\n".join(lines) + "\\n"'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
      - name: Freeze 0036
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 'https://huggingface.co/datasets/SAIRfoundation/equational-theories-selected-problems/resolve/main/data/stage2_stress_test.jsonl' -o /tmp/stress.jsonl
          test "$(sha256sum /tmp/stress.jsonl | awk '{print $1}')" = "$STRESS_SHA256"
          python - <<'PY'
          import json
          rows=[json.loads(x) for x in open('/tmp/stress.jsonl') if x.strip()]
          r=next(r for r in rows if r['id']=='order5_normal_0036')
          open('/tmp/row.json','w').write(json.dumps(r,sort_keys=True))
          PY
      - name: Official Lean verify graph-compiled idempotence
        shell: bash
        run: |
          set -euo pipefail
          source .env.judge
          python experiments/mathgraph/run_graph_path_idempotence_official_gate.py --solver /tmp/solver.py --row /tmp/row.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-graph-path-idempotence-official-gate
          path: experiments/mathgraph/results/graph-path-idempotence-official-gate.json
          if-no-files-found: warn
          retention-days: 30

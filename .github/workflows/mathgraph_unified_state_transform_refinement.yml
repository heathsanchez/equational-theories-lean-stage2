name: MathGraph Unified State Transform Refinement
on:
  pull_request:
    branches:
      - mathgraph/unified-state-transform-refinement-base-20260821
  workflow_dispatch:

jobs:
  unified-refine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'datasets>=3,<5'
      - name: Run unified state-transform refinement gate
        run: python experiments/mathgraph/run_unified_state_transform_refinement.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-state-transform-refinement
          path: experiments/mathgraph/results/unified-state-transform-refinement.json

name: MathGraph Given Clause Integrated 800 Audit
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'mathgraph/developmental-continuation-20260820'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/developmental-continuation-20260820
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch isolated promotion candidate
        run: python experiments/mathgraph/patch_given_clause_fallback.py
      - name: Cache Lean and Lake packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: mathgraph-lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Setup official Lean judge
        env:
          SKIP_DOCKER: '1'
        run: bash scripts/setup.sh
      - name: Install official proxy tooling
        run: python -m pip install 'openai>=1,<3' 'datasets>=3,<5'
      - name: Run patched solver on all 800 through official proxy + Lean
        shell: bash
        run: |
          set -euo pipefail
          source .env.judge
          mkdir -p experiments/mathgraph/results
          python - <<'PY'
          import json,time
          from collections import Counter
          from pathlib import Path
          from datasets import load_dataset
          from pipeline.proxy import load_config,run_solver
          CONFIGS=['evaluation_normal','evaluation_hard','evaluation_extra_hard','evaluation_order5']
          OUT=Path('experiments/mathgraph/results/given-clause-integrated-800.json')
          cfg=load_config();cfg['solver']['timeout_seconds']=60;cfg['judge']['lean_timeout_seconds']=90;cfg['sandbox']['mode']='none'
          rows=[];started=time.monotonic();submission=Path('submissions/mathgraph')
          for ds_cfg in CONFIGS:
            for raw in load_dataset('SAIRfoundation/equational-theories-selected-problems',ds_cfg,split='train'):
              r=dict(raw);problem={k:r[k] for k in r if k not in ('truth','label','is_true')}
              result=run_solver(submission,problem,cfg)
              rows.append({'config':ds_cfg,'id':r.get('id'),'truth':r.get('truth',r.get('label',r.get('is_true'))),'solved':bool(result.get('solved')),'verdict':result.get('verdict'),'judge_calls':result.get('judge_calls',0),'llm_calls':result.get('llm_calls',0),'last_log':(result.get('log') or [])[-1] if result.get('log') else None})
              print(ds_cfg,r.get('id'),'solved=',result.get('solved'),'verdict=',result.get('verdict'),flush=True)
          solved=[r for r in rows if r['solved']];unsolved=[r for r in rows if not r['solved']]
          out={'schema':'mathgraph.given-clause-integrated-800.v1','proxy_timeout_seconds':60,'total':len(rows),'solved':len(solved),'unsolved_count':len(unsolved),'unsolved_ids':[r['id'] for r in unsolved],'verdict_counts':dict(Counter(r['verdict'] for r in solved)),'judge_calls':sum(r['judge_calls'] for r in rows),'llm_calls':sum(r['llm_calls'] for r in rows),'elapsed_seconds':round(time.monotonic()-started,3),'rows':rows}
          OUT.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n');print(json.dumps({k:out[k] for k in ('total','solved','unsolved_count','unsolved_ids','verdict_counts','judge_calls','llm_calls','elapsed_seconds')},indent=2))
          if out['solved'] < 796: raise SystemExit('promotion gate failed: expected >=796')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-given-clause-integrated-800
          path: experiments/mathgraph/results/given-clause-integrated-800.json
          if-no-files-found: error
          retention-days: 30

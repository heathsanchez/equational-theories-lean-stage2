name: MathGraph O5-0014 Q3 Addressability Fast

on:
  pull_request:
    branches:
      - mathgraph/obstruction-vector-q0-composition-timeout-base-20260821

jobs:
  diagnose-q3:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'datasets>=3,<5'
      - name: Run bounded Q3 addressability diagnostic
        run: python experiments/mathgraph/run_obstruction_q3_addressability_fast.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obstruction-q3-addressability-fast
          path: experiments/mathgraph/results/obstruction-q3-addressability-fast.json
          if-no-files-found: warn

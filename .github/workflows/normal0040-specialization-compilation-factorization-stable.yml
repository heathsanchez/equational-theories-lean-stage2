name: Normal0040 Specialization Compilation Factorization Stable Gate
on:
  pull_request:
    branches: [mathgraph/residual-factorization-base-20260821]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/residual-factorization-optimum-20260821
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=3,<5'
      - name: Verify frozen protocol predates executable
        run: |
          set -euo pipefail
          test "$(git rev-list --count e24cb9371b8db1fb6f0169d4dc78fbc0966ab521..36cad38a46d1c8edccf487a6b86097445389c452)" -ge 1
          git show e24cb9371b8db1fb6f0169d4dc78fbc0966ab521:experiments/mathgraph/protocols/normal0040-specialization-compilation-factorization-v1.json >/dev/null
      - name: Run specialization compilation factorization
        run: python experiments/mathgraph/run_normal0040_specialization_compilation_factorization_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: normal0040-specialization-compilation-factorization-v1
          path: experiments/mathgraph/results/normal0040-specialization-compilation-factorization-gate.json

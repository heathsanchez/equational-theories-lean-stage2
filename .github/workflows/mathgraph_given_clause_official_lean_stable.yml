name: MathGraph Given Clause Official Lean Stable
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-lean:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'mathgraph/developmental-continuation-20260820'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/developmental-continuation-20260820
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache Lean and Lake packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: mathgraph-lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Setup official Lean judge
        env:
          SKIP_DOCKER: '1'
        run: bash scripts/setup.sh
      - name: Install evaluation tooling
        run: python -m pip install 'datasets>=3,<5' 'openai>=1,<3'
      - name: Run hard0196 official Lean gate
        shell: bash
        run: |
          set -euo pipefail
          source .env.judge
          python experiments/mathgraph/run_given_clause_official_lean_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-given-clause-official-lean-stable
          path: experiments/mathgraph/results/given-clause-official-lean-gate.json
          if-no-files-found: error
          retention-days: 30

name: MathGraph residual-3 second-stage separator

on:
  push:
    branches: [mathgraph/continuation-priority-window-20260826]
    paths:
      - '.github/workflows/mathgraph_residual3_second_stage_separator.yml'
      - 'experiments/mathgraph/run_residual3_second_stage_separator.py'
  workflow_dispatch:

jobs:
  separator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m py_compile experiments/mathgraph/run_residual3_second_stage_separator.py
      - name: Run second-stage separator census
        run: python experiments/mathgraph/run_residual3_second_stage_separator.py
      - uses: actions/upload-artifact@v4
        with:
          name: residual3-second-stage-separator
          path: experiments/mathgraph/results/residual3-second-stage-separator.json
          if-no-files-found: error

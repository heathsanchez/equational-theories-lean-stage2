name: MathGraph Minimal Lawful Continuation Refinement
on:
  pull_request:
    branches:
      - mathgraph/minimal-lawful-refinement-base-v2-20260821
  workflow_dispatch:

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'datasets>=3,<5'
      - name: Run minimal lawful continuation refinement
        run: python experiments/mathgraph/run_minimal_lawful_continuation_refinement.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimal-lawful-continuation-refinement
          path: experiments/mathgraph/results/minimal-lawful-continuation-refinement.json

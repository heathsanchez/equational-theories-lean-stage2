name: MathGraph residual-3 corridor causal
on:
  push:
    branches: [mathgraph/continuation-priority-window-20260826]
    paths:
      - 'experiments/mathgraph/run_corridor_aware_continuation.py'
      - '.github/workflows/mathgraph_residual3_corridor_causal.yml'
  workflow_dispatch:
jobs:
  corridor_causal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m py_compile experiments/mathgraph/run_corridor_aware_continuation.py
      - name: Run corridor-aware causal test
        run: python experiments/mathgraph/run_corridor_aware_continuation.py
      - uses: actions/upload-artifact@v4
        with:
          name: residual3-corridor-causal
          path: experiments/mathgraph/results/corridor-aware-continuation.json
          if-no-files-found: error

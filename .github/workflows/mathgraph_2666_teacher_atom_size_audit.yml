name: MathGraph 2666 Teacher Atom Size Audit

on:
  pull_request:
    paths:
      - experiments/mathgraph/run_2666_teacher_atom_size_audit.py
      - .github/workflows/mathgraph_2666_teacher_atom_size_audit.yml
  push:
    branches:
      - mathgraph/18-edge-constructor-separator-20260824
    paths:
      - experiments/mathgraph/run_2666_teacher_atom_size_audit.py
      - .github/workflows/mathgraph_2666_teacher_atom_size_audit.yml

permissions:
  contents: read

jobs:
  size-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/18-edge-constructor-separator-20260824
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python experiments/mathgraph/run_2666_teacher_atom_size_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-2666-teacher-atom-size-audit
          path: experiments/mathgraph/results/2666-teacher-atom-size-audit.json
          if-no-files-found: warn

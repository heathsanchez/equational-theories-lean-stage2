name: Normal0040 Whole Context Causal Attack Stable Gate
on:
  pull_request:
    branches: [mathgraph/residual-factorization-base-20260821]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/residual-factorization-optimum-20260821
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=3,<5'
      - name: Verify frozen protocol predates executable
        run: |
          set -euo pipefail
          test "$(git rev-list --count d3bf60524430d2e6182f8b7bb5f711e3894cc3f9..373004e8063bde9df85261eea652e72e37b5cf48)" -ge 1
          git show d3bf60524430d2e6182f8b7bb5f711e3894cc3f9:experiments/mathgraph/protocols/normal0040-whole-context-causal-attack-v1.json >/dev/null
      - name: Run whole-context causal attack
        run: python experiments/mathgraph/run_normal0040_whole_context_causal_attack_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: normal0040-whole-context-causal-attack-v1
          path: experiments/mathgraph/results/normal0040-whole-context-causal-attack-gate.json

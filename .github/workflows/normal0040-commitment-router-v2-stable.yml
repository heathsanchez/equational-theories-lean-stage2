name: Normal0040 Commitment Router V2 Stable Gate
on:
  pull_request:
    branches: [mathgraph/residual-factorization-base-20260821]
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/residual-factorization-optimum-20260821
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=3,<5'
      - name: Verify frozen router v2 protocol exists
        run: git show HEAD:experiments/mathgraph/protocols/normal0040-commitment-router-v2.json >/dev/null
      - name: Run revised commitment router diagnostic
        run: python experiments/mathgraph/run_normal0040_commitment_router_v2_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: normal0040-commitment-router-v2
          path: experiments/mathgraph/results/normal0040-commitment-router-v2-gate.json

name: MathGraph Target-Grounded Budget Sweep

on:
  push:
    branches:
      - mathgraph/grounded-budget-sweep-20260820
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/grounded-budget-sweep-20260820
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dataset tooling
        run: python -m pip install 'datasets>=3,<5'
      - name: Extract six residuals
        run: |
          python - <<'PY'
          import json
          from datasets import load_dataset
          wanted={'evaluation_normal_0036','evaluation_normal_0040','evaluation_normal_0158','evaluation_hard_0196','evaluation_order5_0014','evaluation_order5_0042'}
          found={}
          for config in ['evaluation_normal','evaluation_hard','evaluation_order5']:
              for row in load_dataset('SAIRfoundation/equational-theories-selected-problems',config,split='train'):
                  if row.get('id') in wanted: found[row['id']]=dict(row)
          missing=sorted(wanted-set(found))
          if missing: raise SystemExit(f'missing {missing}')
          json.dump([found[k] for k in sorted(found)],open('/tmp/six.json','w'),indent=2)
          PY
      - name: Run target-grounded sweep
        run: |
          python experiments/mathgraph/run_target_grounded_budget_sweep.py --input /tmp/six.json --output experiments/mathgraph/results/target-grounded-budget-sweep-20260820.json
      - name: Upload sweep
        uses: actions/upload-artifact@v4
        with:
          name: mathgraph-target-grounded-budget-sweep
          path: experiments/mathgraph/results/target-grounded-budget-sweep-20260820.json
      - name: Persist sweep result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/mathgraph/results/target-grounded-budget-sweep-20260820.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(research): persist target-grounded sweep [skip ci]'
          git push origin HEAD:mathgraph/grounded-budget-sweep-20260820

name: MathGraph Quotient Recompile Composition Gate
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:
jobs:
  compose:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.title == '[MathGraph Trigger] Quotient Recompile Composition Gate')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/developmental-continuation-20260820
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=3,<5'
      - name: Run quotient to normalizer composition gate
        run: python experiments/mathgraph/run_quotient_recompile_composition_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-quotient-recompile-composition-gate
          path: experiments/mathgraph/results/quotient-recompile-composition-gate.json
          if-no-files-found: warn
          retention-days: 30

name: MathGraph 2666 Developmental Frontier

on:
  pull_request:
    paths:
      - experiments/mathgraph/run_2666_developmental_frontier.py
      - experiments/mathgraph/run_2666_role_aware_continuation.py
      - experiments/mathgraph/run_2666_role_aware_intermediate_coverage.py
      - experiments/mathgraph/run_2666_oriented_basis_coverage.py
      - .github/workflows/mathgraph_2666_developmental_frontier.yml
  push:
    branches:
      - mathgraph/18-edge-constructor-separator-20260824
    paths:
      - experiments/mathgraph/run_2666_developmental_frontier.py
      - experiments/mathgraph/run_2666_role_aware_continuation.py
      - experiments/mathgraph/run_2666_role_aware_intermediate_coverage.py
      - experiments/mathgraph/run_2666_oriented_basis_coverage.py
      - .github/workflows/mathgraph_2666_developmental_frontier.yml

permissions:
  contents: read

jobs:
  developmental-frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/18-edge-constructor-separator-20260824
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run persistent oriented basis coverage gate
        run: python experiments/mathgraph/run_2666_oriented_basis_coverage.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-2666-oriented-basis-coverage
          path: experiments/mathgraph/results/2666-oriented-basis-coverage.json
          if-no-files-found: warn
# trigger: oriented-basis-v1

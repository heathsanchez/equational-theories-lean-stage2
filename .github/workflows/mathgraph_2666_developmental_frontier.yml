name: MathGraph 2666 Developmental Frontier

on:
  pull_request:
    paths:
      - experiments/mathgraph/apply_compact_superposition_expanded_retry.py
      - experiments/mathgraph/run_pseudo_hidden_generalization_gate.py
      - .github/workflows/mathgraph_2666_developmental_frontier.yml
  push:
    branches:
      - mathgraph/18-edge-constructor-separator-20260824
    paths:
      - experiments/mathgraph/apply_compact_superposition_expanded_retry.py
      - experiments/mathgraph/run_pseudo_hidden_generalization_gate.py
      - .github/workflows/mathgraph_2666_developmental_frontier.yml

permissions:
  contents: read

jobs:
  developmental-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/18-edge-constructor-separator-20260824
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply bounded expanded compact-superposition retry
        run: python experiments/mathgraph/apply_compact_superposition_expanded_retry.py
      - name: Run pseudo-hidden 96-case promotion gate
        run: python experiments/mathgraph/run_pseudo_hidden_generalization_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-expanded-compact-pseudo-hidden-ab
          path: experiments/mathgraph/results/pseudo-hidden-generalization-gate.json
          if-no-files-found: warn
# trigger: expanded-compact-pseudo-hidden-ab-v1

name: MathGraph 2666 Developmental Frontier

on:
  pull_request:
    paths:
      - experiments/mathgraph/run_18_edge_future_controller_gate.py
      - experiments/mathgraph/run_18_edge_future_action_ordering.py
      - experiments/mathgraph/run_3366_iterated_contextual_contraction.py
      - experiments/mathgraph/run_3366_round8_interface_attribution.py
      - .github/workflows/mathgraph_2666_developmental_frontier.yml
  push:
    branches:
      - mathgraph/18-edge-constructor-separator-20260824
    paths:
      - experiments/mathgraph/run_18_edge_future_controller_gate.py
      - experiments/mathgraph/run_18_edge_future_action_ordering.py
      - experiments/mathgraph/run_3366_iterated_contextual_contraction.py
      - experiments/mathgraph/run_3366_round8_interface_attribution.py
      - .github/workflows/mathgraph_2666_developmental_frontier.yml

permissions:
  contents: read

jobs:
  developmental-frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/18-edge-constructor-separator-20260824
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run decisive 18-edge future-relative controller gate
        run: python experiments/mathgraph/run_18_edge_future_controller_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-18-edge-future-controller-gate
          path: experiments/mathgraph/results/18-edge-future-controller-gate.json
          if-no-files-found: warn
# trigger: future-controller-gate-v1

name: MathGraph 2666 Developmental Frontier

on:
  pull_request:
    paths:
      - experiments/mathgraph/run_pseudo_hidden_residual_attribution.py
      - .github/workflows/mathgraph_2666_developmental_frontier.yml
  push:
    branches:
      - mathgraph/18-edge-constructor-separator-20260824
    paths:
      - experiments/mathgraph/run_pseudo_hidden_residual_attribution.py
      - .github/workflows/mathgraph_2666_developmental_frontier.yml

permissions:
  contents: read

jobs:
  developmental-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/18-edge-constructor-separator-20260824
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run pseudo-hidden residual attribution gate
        run: python experiments/mathgraph/run_pseudo_hidden_residual_attribution.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-pseudo-hidden-residual-attribution
          path: experiments/mathgraph/results/pseudo-hidden-residual-attribution.json
          if-no-files-found: warn
# trigger: pseudo-hidden-residual-attribution-v1

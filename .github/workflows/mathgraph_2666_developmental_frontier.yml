name: MathGraph 2666 Developmental Frontier

on:
  pull_request:
    paths:
      - experiments/mathgraph/run_hard2_0199_superposition_ablation.py
      - .github/workflows/mathgraph_2666_developmental_frontier.yml
  push:
    branches:
      - mathgraph/18-edge-constructor-separator-20260824
    paths:
      - experiments/mathgraph/run_hard2_0199_superposition_ablation.py
      - .github/workflows/mathgraph_2666_developmental_frontier.yml

permissions:
  contents: read

jobs:
  developmental-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/18-edge-constructor-separator-20260824
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run hard2_0199 superposition ablation
        run: python experiments/mathgraph/run_hard2_0199_superposition_ablation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-hard2-0199-superposition-ablation
          path: experiments/mathgraph/results/hard2-0199-superposition-ablation.json
          if-no-files-found: warn
# trigger: hard2-0199-superposition-ablation-v1

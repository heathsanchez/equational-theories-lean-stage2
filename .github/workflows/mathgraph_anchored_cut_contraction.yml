name: MathGraph Anchored Cut Contraction Gate
on:
  pull_request:
    branches: [mathgraph/isolated-actions-base-20260821]
    paths:
      - 'experiments/mathgraph/run_anchored_cut_contraction_gate.py'
      - '.github/workflows/mathgraph_anchored_cut_contraction.yml'
  workflow_dispatch:
jobs:
  anchored-cut:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: mathgraph-anchored-cut
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'datasets>=3,<5'
      - name: Run K2 anchored cut contraction gate
        run: python experiments/mathgraph/run_anchored_cut_contraction_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-anchored-cut-contraction
          path: experiments/mathgraph/results/anchored-cut-contraction-gate.json

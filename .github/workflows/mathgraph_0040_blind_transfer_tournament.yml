name: MathGraph blind transfer tournament
on:
  push:
    branches:
      - mathgraph/residual-router-796-20260826
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    if: false
    runs-on: ubuntu-24.04
    steps:
      - run: echo historical blind-transfer job retained but disabled for endgame probe

  final-three-797:
    if: false
    runs-on: ubuntu-24.04
    steps:
      - run: echo historical final-three job retained but disabled for endgame probe

  msi-full-continuation-798:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'openai>=1,<2'
      - name: Pin official Stage 2 Lean and Mathlib
        run: |
          printf '%s\n' 'leanprover/lean4:v4.32.2' > lean-toolchain
          python - <<'PY'
          from pathlib import Path
          p=Path('lakefile.lean')
          p.write_text(p.read_text().replace('896cc56a395e1615786fac56564a3fe6bfeebcc4','905b95818eb32af7874a58b427f50c1711a5e96c'))
          Path('lake-manifest.json').unlink(missing_ok=True)
          PY
      - name: Setup official-pinned judge
        env:
          SKIP_DOCKER: '1'
        run: bash scripts/setup.sh
      - name: Download order5 evaluation set
        run: |
          mkdir -p /tmp/sair_eval
          curl -fL --retry 3 'https://huggingface.co/datasets/SAIRfoundation/equational-theories-selected-problems/resolve/main/data/evaluation_order5.jsonl' -o /tmp/sair_eval/evaluation_order5.jsonl
      - name: MSI full continuation congruence
        run: |
          source .env.judge
          python experiments/mathgraph/run_798_msi_full_continuation.py \
            --id evaluation_order5_0042 \
            --input /tmp/sair_eval/evaluation_order5.jsonl \
            --frontier-seconds 12 \
            --given-seconds 5 \
            --frontier-rounds 3 \
            --given-steps 16 \
            --candidate-budget 512 \
            --probe-partners 64 \
            --effect-keep 32 \
            --closure-rounds 2 \
            --closure-new-per-round 128 \
            --output experiments/mathgraph/results/798-evaluation_order5_0042-msi-full-continuation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-798-evaluation_order5_0042-msi-full-continuation
          path: experiments/mathgraph/results/798-evaluation_order5_0042-msi-full-continuation.json
          if-no-files-found: ignore

name: MathGraph O5-0014 Obstruction Vector Q0 Composition
on:
  pull_request:
    branches:
      - mathgraph/obstruction-vector-q0-composition-base-20260821
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'datasets>=3,<5'
      - name: Run bounded obstruction-vector diagnostic
        run: python experiments/mathgraph/run_obstruction_vector_q0_composition.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obstruction-vector-q0-composition
          path: experiments/mathgraph/results/obstruction-vector-q0-composition.json

name: MathGraph 796 0040 compatibility lift
on:
  push:
    branches: [mathgraph/residual-router-796-20260826]
  workflow_dispatch:
jobs:
  compat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'openai>=1,<2'
      - run: bash scripts/setup.sh
        env: {SKIP_DOCKER: '1'}
      - name: Download official normal evaluation
        run: |
          mkdir -p /tmp/sair_eval
          curl -fL --retry 3 'https://huggingface.co/datasets/SAIRfoundation/equational-theories-selected-problems/resolve/main/data/evaluation_normal.jsonl' -o /tmp/sair_eval/evaluation_normal.jsonl
      - name: Run compatibility lift on 0040
        run: |
          source .env.judge
          python experiments/mathgraph/run_796_0040_compatibility_lift.py --normal /tmp/sair_eval/evaluation_normal.jsonl --output experiments/mathgraph/results/796-0040-compatibility-lift.json
      - name: Run standardized-apart self-overlap separator
        run: |
          source .env.judge
          python experiments/mathgraph/run_796_0040_standardized_apart_self_overlap.py --input /tmp/sair_eval/evaluation_normal.jsonl --output experiments/mathgraph/results/796-0040-standardized-apart.json
      - name: Continue search after materialized overlap
        run: |
          source .env.judge
          python experiments/mathgraph/run_796_0040_materialize_overlap_continue.py --input /tmp/sair_eval/evaluation_normal.jsonl --output experiments/mathgraph/results/796-0040-materialize-overlap-continue.json
      - name: Diagnose f126 replay boundary
        run: |
          source .env.judge
          python experiments/mathgraph/run_796_0040_f126_replay_diagnostic.py --input /tmp/sair_eval/evaluation_normal.jsonl --output experiments/mathgraph/results/796-0040-f126-replay-diagnostic.json
      - name: Introspect compact superposition compiler
        run: |
          python - <<'PY'
          import importlib.util, inspect
          from pathlib import Path
          p=Path('submissions/mathgraph/solver.py')
          spec=importlib.util.spec_from_file_location('mg',p); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          for name in sorted(n for n in dir(m) if 'Superposition' in n or 'Refutation' in n or n == 'Recipe'):
              obj=getattr(m,name)
              print('\n===== '+name+' =====')
              try: print(inspect.getsource(obj))
              except Exception as e: print('NO_SOURCE',repr(e))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mathgraph-796-0040-separators
          path: |
            experiments/mathgraph/results/796-0040-compatibility-lift.json
            experiments/mathgraph/results/796-0040-standardized-apart.json
            experiments/mathgraph/results/796-0040-materialize-overlap-continue.json
            experiments/mathgraph/results/796-0040-f126-replay-diagnostic.json
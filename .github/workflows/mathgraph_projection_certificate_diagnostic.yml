name: MathGraph projection certificate diagnostic

on:
  push:
    branches: [mathgraph/fresh-stress-projection-closure-20260831]
    paths:
      - '.github/workflows/mathgraph_projection_certificate_diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONHASHSEED: '0'
      OFFICIAL_REPO_SHA: 817a4653bf762584931d49c6714c9fcfab7df66a
      ISOLATION_SOURCE_SHA: e8fadce708df43ed7cdbd598b673941e2120053d
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild exact successful isolation source state with certificate capture
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/source "$ISOLATION_SOURCE_SHA"
          python /tmp/source/experiments/mathgraph/build_projection_closure_early_schematic.py \
            --base /tmp/source/submissions/mathgraph/solver.py \
            --output /tmp/solver.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/solver.py'); s=p.read_text()
          a='frontier_seconds = min(12.0, max(0.5, timeout / 40.0))'
          b='given_seconds = min(5.0, max(0.5, timeout / 80.0))'
          assert s.count(a)==1 and s.count(b)==1
          s=s.replace(a,'frontier_seconds = 30.0').replace(b,'given_seconds = 10.0')
          block='''    # Generic source-only closure before finite-model and deep routes.\n    if run_projection_closure_fallback(source, target, timeout):\n        return\n\n'''
          assert s.count(block)==1
          s=s.replace(block, block+'    return\n\n', 1)
          # Preserve proof generation exactly; only mirror the compact certificate
          # to disk immediately before its existing size check/judge call.
          marker='''        code = compact_certificate(recipe)\n        if code is None:\n            return False\n        code_bytes = len(code.encode("utf-8"))\n'''
          replacement='''        code = compact_certificate(recipe)\n        if code is None:\n            return False\n        with open("/tmp/mg-last-cert.lean", "w", encoding="utf-8") as _mg_diag:\n            _mg_diag.write(code)\n        code_bytes = len(code.encode("utf-8"))\n'''
          assert s.count(marker)==1
          s=s.replace(marker,replacement,1)
          p.write_text(s)
          PY
          python /tmp/source/experiments/mathgraph/determinize_solver_order.py /tmp/solver.py
          python -m py_compile /tmp/solver.py
          echo "candidate_sha256=$(sha256sum /tmp/solver.py | awk '{print $1}')"
          echo "candidate_bytes=$(wc -c < /tmp/solver.py | tr -d ' ')"
      - name: Checkout pinned official harness
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/SAIRcompetition/equational-theories-lean-stage2.git /tmp/official
          cd /tmp/official
          git checkout "$OFFICIAL_REPO_SHA"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.33.1'
          grep -q '0df444a360eaa60ab8c11dca51a86af692955474' lake-manifest.json
          mkdir -p submissions/mathgraph_projection
          cp /tmp/solver.py submissions/mathgraph_projection/solver.py
      - name: Setup official Lean judge
        working-directory: /tmp/official
        env:
          SKIP_DOCKER: '1'
        run: bash scripts/setup.sh
      - name: Install proxy dependency
        working-directory: /tmp/official
        run: python -m pip install 'openai>=1,<3'
      - name: Fetch stress set
        run: |
          curl -fL --retry 4 'https://huggingface.co/datasets/SAIRfoundation/equational-theories-selected-problems/resolve/main/data/stage2_stress_test.jsonl' -o /tmp/stage2_stress_test.jsonl
          test "$(wc -l < /tmp/stage2_stress_test.jsonl | tr -d ' ')" = '200'
      - name: Capture exact certificate and judge residuals
        working-directory: /tmp/official
        shell: bash
        run: |
          set +e
          source .env.judge
          python - <<'PY'
          import json,sys,time,shutil
          from pathlib import Path
          ROOT=Path('/tmp/official'); sys.path.insert(0,str(ROOT))
          from pipeline.proxy import load_config,load_problems,run_solver
          rows={r['id']:r for r in load_problems('/tmp/stage2_stress_test.jsonl')}
          cfg=load_config(); cfg.setdefault('sandbox',{})['mode']='none'
          out=Path('/tmp/diag'); out.mkdir(exist_ok=True)
          for rid in ('order5_normal_0030','order5_normal_0036'):
              cert=Path('/tmp/mg-last-cert.lean')
              if cert.exists(): cert.unlink()
              row=rows[rid]; trace=[]; t=time.monotonic()
              try:
                  result=run_solver(ROOT/'submissions/mathgraph_projection',row,cfg,trace_hook=lambda e:trace.append(e))
                  err=None
              except Exception as exc:
                  result={}; err=f'{type(exc).__name__}: {exc}'
              judge_events=[e for e in trace if e.get('type')=='judge']
              rec={'id':rid,'eq1_id':row['eq1_id'],'eq2_id':row['eq2_id'],'elapsed':round(time.monotonic()-t,3),'solved':bool(result.get('solved')),'verdict':result.get('verdict'),'judge_calls':result.get('judge_calls',0),'judge_events':judge_events,'llm_calls':result.get('llm_calls',0),'error':err}
              (out/f'{rid}.json').write_text(json.dumps(rec,indent=2,sort_keys=True))
              if cert.exists(): shutil.copy(cert,out/f'{rid}.lean')
              print('DIAG_RESULT',json.dumps(rec,sort_keys=True),flush=True)
          PY
          for f in /tmp/diag/*.json; do echo "===== $f ====="; cat "$f"; done
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: projection-certificate-diagnostic
          path: /tmp/diag
          if-no-files-found: error
          retention-days: 30

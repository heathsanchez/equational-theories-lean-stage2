name: MathGraph Developmental Continuation V2
on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  developmental-continuation-v2:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.title, '[MathGraph Trigger] Developmental Continuation V2')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/developmental-continuation-20260820
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=3,<5'
      - name: Run V2 relevance-weighted matched-compute comparison
        run: python experiments/mathgraph/run_developmental_continuation_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: mathgraph-developmental-continuation-v2
          path: experiments/mathgraph/results/developmental-continuation-v2.json
          if-no-files-found: error
          retention-days: 30

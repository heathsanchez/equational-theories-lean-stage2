name: MathGraph 0036 Diagonal Fiber Production Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - codex/mathgraph-0036-target-bridge-macro
    paths:
      - submissions/mathgraph_cleanroom/**
      - submissions/mathgraph_cleanroom_solo_gemma/**
      - submissions/mathgraph_cleanroom_solo_oss/**
      - submissions/mathgraph_cleanroom_marathon_gemma/**
      - submissions/mathgraph_cleanroom_marathon_oss/**
      - tests/test_mathgraph_cleanroom_generalization.py
      - experiments/mathgraph/residual12/run_0036_diagonal_fiber_production_qualification.py
      - .github/workflows/mathgraph_0036_diagonal_fiber_production.yml

permissions:
  contents: read

env:
  PREREG_COMMIT: 535cf2471f3c7fef9f7e8cd90f25f803c8e1544f
  PREREG_SHA256: 4100662b040d58e75a5d405ad7be0c76a40e326d3a07c3bdcb5b346c89d5d00a
  BASELINE_SOLVER_SHA256: a92eae8cce4fdf7c787c3218fa4f7eb1158c92a6b57f2920199ddbe6e7726a08

jobs:
  focused-official-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify frozen protocol predates production executable
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PREREG_COMMIT" HEAD
          test "$(git show "$PREREG_COMMIT":experiments/mathgraph/residual12/0036_diagonal_fiber_production_preregistration.json | sha256sum | cut -d' ' -f1)" = "$PREREG_SHA256"
          test "$(git show "$PREREG_COMMIT":submissions/mathgraph_cleanroom/solver.py | sha256sum | cut -d' ' -f1)" = "$BASELINE_SOLVER_SHA256"
          test "$(git diff --numstat "$PREREG_COMMIT" -- submissions/mathgraph_cleanroom/solver.py)" = $'66\t0\tsubmissions/mathgraph_cleanroom/solver.py'
      - name: Install qualification tools
        run: python -m pip install 'pytest>=8,<9' 'datasets>=3,<5' 'openai>=1,<3'
      - name: Run cleanroom unit and provenance gates
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest -q \
            tests/test_mathgraph_cleanroom_generalization.py \
            tests/test_mathgraph_cleanroom_finite_search.py \
            tests/test_mathgraph_final_portfolio.py
      - name: Cache Lean and Lake packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: mathgraph-cleanroom-lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Build official Lean judge
        env:
          SKIP_DOCKER: "1"
        run: bash scripts/setup.sh
      - name: Run focused production gate
        shell: bash
        run: |
          set -euo pipefail
          source .env.judge
          python experiments/mathgraph/residual12/run_0036_diagonal_fiber_production_qualification.py \
            --mode focused \
            --output experiments/mathgraph/results/0036_diagonal_fiber_production_focused.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-0036-diagonal-fiber-production-focused
          path: experiments/mathgraph/results/0036_diagonal_fiber_production_focused.json
          if-no-files-found: error
          retention-days: 30

  full-800-official-audit:
    needs: focused-official-lean
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify frozen protocol and production insertion
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PREREG_COMMIT" HEAD
          test "$(sha256sum experiments/mathgraph/residual12/0036_diagonal_fiber_production_preregistration.json | cut -d' ' -f1)" = "$PREREG_SHA256"
          test "$(git diff --numstat "$PREREG_COMMIT" -- submissions/mathgraph_cleanroom/solver.py)" = $'66\t0\tsubmissions/mathgraph_cleanroom/solver.py'
      - name: Install evaluation tooling
        run: python -m pip install 'datasets>=3,<5' 'openai>=1,<3'
      - name: Cache Lean and Lake packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: mathgraph-cleanroom-lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Build official Lean judge
        env:
          SKIP_DOCKER: "1"
        run: bash scripts/setup.sh
      - name: Run all released 800 problems
        shell: bash
        run: |
          set -euo pipefail
          source .env.judge
          python experiments/mathgraph/residual12/run_0036_diagonal_fiber_production_qualification.py \
            --mode full \
            --output experiments/mathgraph/results/0036_diagonal_fiber_production_800.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-0036-diagonal-fiber-production-800
          path: experiments/mathgraph/results/0036_diagonal_fiber_production_800.json
          if-no-files-found: error
          retention-days: 30

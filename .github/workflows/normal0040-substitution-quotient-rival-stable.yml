name: Normal0040 Substitution Quotient Rival Stable Gate
on:
  pull_request:
    branches: [mathgraph/residual-factorization-base-20260821]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/residual-factorization-optimum-20260821
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=3,<5'
      - name: Verify frozen protocol predates executable
        run: |
          set -euo pipefail
          test "$(git rev-list --count 8d1523b258491b8161d409c40759806cab21c9d6..f3955b844457218582bd5778361cbd9c2a74d977)" -ge 1
          git show 8d1523b258491b8161d409c40759806cab21c9d6:experiments/mathgraph/protocols/normal0040-substitution-quotient-rival-v1.json >/dev/null
      - name: Run substitution quotient rival diagnostic
        run: python experiments/mathgraph/run_normal0040_substitution_quotient_rival_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: normal0040-substitution-quotient-rival-v1
          path: experiments/mathgraph/results/normal0040-substitution-quotient-rival-gate.json

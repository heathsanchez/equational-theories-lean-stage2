name: MathGraph 799 MSI adaptive active-probe
on:
  push:
    branches: [mathgraph/residual-router-796-20260826]
    paths:
      - experiments/mathgraph/run_799_msi_adaptive_compositional_separator.py
      - .github/workflows/mathgraph_799_msi_adaptive_active_probe.yml
  workflow_dispatch:

jobs:
  adaptive-0042:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'openai>=1,<2'
      - name: Pin official Stage 2 Lean and Mathlib
        run: |
          printf '%s\n' 'leanprover/lean4:v4.32.2' > lean-toolchain
          python - <<'PY'
          from pathlib import Path
          p=Path('lakefile.lean')
          p.write_text(p.read_text().replace('896cc56a395e1615786fac56564a3fe6bfeebcc4','905b95818eb32af7874a58b427f50c1711a5e96c'))
          Path('lake-manifest.json').unlink(missing_ok=True)
          PY
      - name: Setup official-pinned judge
        env:
          SKIP_DOCKER: '1'
        run: bash scripts/setup.sh
      - name: Fetch official order-5 evaluation set
        run: |
          mkdir -p /tmp/sair_eval
          curl -fL --retry 3 'https://huggingface.co/datasets/SAIRfoundation/equational-theories-selected-problems/resolve/main/data/evaluation_order5.jsonl' -o /tmp/sair_eval/evaluation_order5.jsonl
      - name: Run adaptive 0042 active-probe experiment
        shell: bash
        run: |
          set -euo pipefail
          source .env.judge
          mkdir -p experiments/mathgraph/results
          echo 'MSI_ADAPTIVE_START evaluation_order5_0042'
          python experiments/mathgraph/run_799_msi_adaptive_compositional_separator.py \
            --id evaluation_order5_0042 \
            --input /tmp/sair_eval/evaluation_order5.jsonl \
            --output experiments/mathgraph/results/799-evaluation_order5_0042-msi-adaptive-compositional-separator.json \
            --frontier-seconds 12 \
            --given-seconds 5 \
            --frontier-rounds 3 \
            --given-steps 16 \
            --candidate-budget 256 \
            --probe-partners 16 \
            --collision-members 4 \
            --child-width 8 \
            --effect-keep 32
          printf 'MSI_ADAPTIVE_DONE '
          cat experiments/mathgraph/results/799-evaluation_order5_0042-msi-adaptive-compositional-separator.json
          printf '\n'
      - uses: actions/upload-artifact@v4
        with:
          name: mathgraph-799-msi-adaptive-active-probe-0042
          path: experiments/mathgraph/results/799-evaluation_order5_0042-msi-adaptive-compositional-separator.json
          if-no-files-found: error

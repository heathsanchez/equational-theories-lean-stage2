name: MathGraph residual-3 scale-conditioned continuation
# causal test: normalized non-expansion separator
on:
  push:
    branches: [mathgraph/continuation-priority-window-20260826]
    paths:
      - '.github/workflows/mathgraph_residual3_scale_conditioned_continuation.yml'
      - 'experiments/mathgraph/run_scale_conditioned_continuation.py'
  workflow_dispatch:

jobs:
  causal-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check explicit experiment
        run: python -m py_compile experiments/mathgraph/run_scale_conditioned_continuation.py
      - name: Run causal proof/replay sweep
        run: python experiments/mathgraph/run_scale_conditioned_continuation.py
      - uses: actions/upload-artifact@v4
        with:
          name: residual3-scale-conditioned-continuation
          path: experiments/mathgraph/results/scale-conditioned-continuation.json
          if-no-files-found: error

name: MathGraph Six Residual Smoke

on:
  push:
    branches:
      - mathgraph/perfect-solver-oracle-20260810

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch frozen proof-controller source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin mathgraph/backward-continuation-research
          git show FETCH_HEAD:experiments/mathgraph/paramodulator_control/run_forward_demodulation_ablation.py > /tmp/controller.py
          git show FETCH_HEAD:colab/data/six_residuals.json > /tmp/six.json
      - name: Build combined candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/mathgraph/build_full_residual_candidate.py \
            --baseline submissions/mathgraph/solver.py \
            --runner /tmp/controller.py \
            --output /tmp/solver_six.py
          python3 -m py_compile /tmp/solver_six.py
          bytes=$(wc -c < /tmp/solver_six.py)
          echo "candidate bytes=$bytes"
          test "$bytes" -le 500000
          if grep -nE 'evaluation_(hard_0196|normal_0036|normal_0040|normal_0158|order5_0014|order5_0042)|8502|27144|20115|21404' /tmp/solver_six.py; then
            echo 'residual-id hostile audit failed' >&2
            exit 1
          fi
      - name: Exercise generic routes on all six
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util,json,sys,time
          spec=importlib.util.spec_from_file_location('sixcand','/tmp/solver_six.py');m=importlib.util.module_from_spec(spec);sys.modules[spec.name]=m;spec.loader.exec_module(m)
          rows=json.load(open('/tmp/six.json'))
          rows=rows.get('rows',rows) if isinstance(rows,dict) else rows
          m.judge=lambda verdict,code:{'status':'accepted'}
          out=[]
          for row in rows:
              source=m.parse_equation(row['equation1']); target=m.parse_equation(row['equation2']); started=time.monotonic()
              via='none'; ok=m.try_streaming_singleton_candidate(source,target,120)
              if ok: via='streaming'
              else:
                  ok=m.try_paramodulation_control_candidate(row,source,target,120)
                  if ok: via='control'
              out.append({'id':row['id'],'ok':bool(ok),'via':via,'elapsed':round(time.monotonic()-started,4)})
          print(json.dumps(out,indent=2))
          open('/tmp/six_smoke.json','w').write(json.dumps(out,indent=2)+'\n')
          if len(out)!=6 or not all(x['ok'] for x in out): raise SystemExit('not all six solved')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: six-residual-smoke
          path: |
            /tmp/solver_six.py
            /tmp/six_smoke.json

name: MathGraph Given Clause Official Lean Gate
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:
jobs:
  official-lean:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.title == '[MathGraph Trigger] Given Clause Saturation Gate')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/developmental-continuation-20260820
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: true
      - run: python -m pip install 'datasets>=3,<5'
      - name: Build judge support
        run: lake build JudgeSupport
      - name: Run official Lean gate
        run: python experiments/mathgraph/run_given_clause_official_lean_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-given-clause-official-lean-gate
          path: experiments/mathgraph/results/given-clause-official-lean-gate.json
          if-no-files-found: warn
          retention-days: 30

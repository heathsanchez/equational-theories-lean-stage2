name: MathGraph Stage1 Distribution ETP Gate
on:
  push:
    branches:
      - mathgraph/18-edge-constructor-separator-20260824
    paths:
      - experiments/mathgraph/run_stage1_distribution_etp_gate.py
      - .github/workflows/mathgraph_stage1_distribution_etp_gate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage1-distribution-etp:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/18-edge-constructor-separator-20260824
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Stage1 distribution matched gate
        run: python experiments/mathgraph/run_stage1_distribution_etp_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-stage1-distribution-etp-gate
          path: experiments/mathgraph/results/stage1-distribution-etp-gate.json
          if-no-files-found: warn

name: MathGraph Cross Cone Provenance Mixer Gate
on:
  pull_request:
    branches: [mathgraph/residual-conditioned-operator-induction-20260821]
  workflow_dispatch:
jobs:
  cross-cone-mixer:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'datasets>=3,<5'
      - name: Run residual-derived cross-cone provenance mixer
        run: python experiments/mathgraph/run_cross_cone_provenance_mixer_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-cross-cone-provenance-mixer
          path: experiments/mathgraph/results/cross-cone-provenance-mixer-gate.json

name: MathGraph projection closure debug capture

on:
  push:
    branches: [mathgraph/fresh-stress-projection-closure-20260831]
    paths:
      - '.github/workflows/mathgraph_projection_debug_capture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONHASHSEED: '0'
      OFFICIAL_REPO_SHA: 817a4653bf762584931d49c6714c9fcfab7df66a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Build diagnostic isolated candidate
        run: |
          set -euo pipefail
          python experiments/mathgraph/build_projection_closure_early_schematic.py --base submissions/mathgraph/solver.py --output /tmp/solver.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/solver.py'); s=p.read_text()
          a='frontier_seconds = min(12.0, max(0.5, timeout / 40.0))'; b='given_seconds = min(5.0, max(0.5, timeout / 80.0))'
          assert s.count(a)==1 and s.count(b)==1
          s=s.replace(a,'frontier_seconds = 30.0').replace(b,'given_seconds = 10.0')
          block='''    # Generic source-only closure before finite-model and deep routes.\n    if run_projection_closure_fallback(source, target, timeout):\n        return\n\n'''
          assert s.count(block)==1
          s=s.replace(block, block+'    return\n\n', 1)
          marker='''def run_projection_closure_fallback(source, target, timeout):\n'''; assert s.count(marker)==1
          debug='''_mg_original_judge = judge\ndef _mg_debug_judge(verdict, certificate):\n    if verdict == "true":\n        from pathlib import Path as _Path\n        _i=len(list(_Path("/tmp").glob("projection-cert-*.lean")))\n        _Path(f"/tmp/projection-cert-{_i}.lean").write_text(certificate)\n    response=_mg_original_judge(verdict, certificate)\n    if verdict == "true":\n        import json as _json\n        from pathlib import Path as _Path\n        _i=len(list(_Path("/tmp").glob("projection-response-*.json")))\n        _Path(f"/tmp/projection-response-{_i}.json").write_text(_json.dumps(response,indent=2,sort_keys=True,default=str))\n        print("MATHGRAPH_DEBUG_JUDGE "+_json.dumps(response,sort_keys=True,default=str),file=sys.stderr,flush=True)\n    return response\njudge = _mg_debug_judge\n\n'''
          s=s.replace(marker,debug+marker,1); p.write_text(s)
          PY
          python experiments/mathgraph/determinize_solver_order.py /tmp/solver.py
          python -m py_compile /tmp/solver.py
          echo "candidate_sha256=$(sha256sum /tmp/solver.py | awk '{print $1}') bytes=$(wc -c < /tmp/solver.py | tr -d ' ')"
      - name: Checkout pinned official harness
        run: |
          git clone --filter=blob:none https://github.com/SAIRcompetition/equational-theories-lean-stage2.git /tmp/official
          cd /tmp/official && git checkout "$OFFICIAL_REPO_SHA"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.33.1'
          grep -q '0df444a360eaa60ab8c11dca51a86af692955474' lake-manifest.json
          mkdir -p submissions/mathgraph_projection && cp /tmp/solver.py submissions/mathgraph_projection/solver.py
      - name: Setup official Lean judge
        working-directory: /tmp/official
        env: {SKIP_DOCKER: '1'}
        run: bash scripts/setup.sh
      - name: Install proxy dependency
        working-directory: /tmp/official
        run: python -m pip install 'openai>=1,<3'
      - name: Fetch stress set
        run: |
          curl -fL --retry 4 'https://huggingface.co/datasets/SAIRfoundation/equational-theories-selected-problems/resolve/main/data/stage2_stress_test.jsonl' -o /tmp/stage2_stress_test.jsonl
      - name: Capture both exact judge residuals
        working-directory: /tmp/official
        shell: bash
        run: |
          source .env.judge
          python - <<'PY'
          import json,sys,time
          from pathlib import Path
          ROOT=Path('/tmp/official'); sys.path.insert(0,str(ROOT))
          from pipeline.proxy import load_config,load_problems,run_solver
          rows={r['id']:r for r in load_problems('/tmp/stage2_stress_test.jsonl')}; cfg=load_config(); cfg.setdefault('sandbox',{})['mode']='none'
          for rid in ('order5_normal_0030','order5_normal_0036'):
              row=rows[rid]; trace=[]; t=time.monotonic(); result=run_solver(ROOT/'submissions/mathgraph_projection',row,cfg,trace_hook=lambda e:trace.append(e))
              print('DEBUG_RESULT',json.dumps({'id':rid,'eq1_id':row['eq1_id'],'eq2_id':row['eq2_id'],'elapsed':round(time.monotonic()-t,3),'result':result,'judge_events':[e for e in trace if e.get('type')=='judge']},sort_keys=True,default=str),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: projection-closure-debug
          path: |
            /tmp/projection-cert-*.lean
            /tmp/projection-response-*.json
          if-no-files-found: warn
          retention-days: 30

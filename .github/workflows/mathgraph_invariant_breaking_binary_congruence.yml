name: MathGraph Invariant Breaking Binary Congruence Gate

on:
  push:
    branches:
      - mathgraph/invariant-breaking-binary-congruence-20260821
  pull_request:
    branches:
      - mathgraph/residual-conditioned-operator-induction-20260821
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/invariant-breaking-binary-congruence-20260821
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=3,<5'
      - name: Run invariant-breaking constructor test
        run: python experiments/mathgraph/run_invariant_breaking_binary_congruence_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-invariant-breaking-binary-congruence
          path: experiments/mathgraph/results/invariant-breaking-binary-congruence-gate.json

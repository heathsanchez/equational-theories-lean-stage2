name: MathGraph Collapse Generalization

on:
  push:
    branches:
      - mathgraph/perfect-solver-oracle-20260810

permissions:
  contents: read

jobs:
  order5-0014-collapse:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test streaming source-to-singleton on 0014
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util,json,sys,time
          from pathlib import Path
          p=Path('submissions/mathgraph/solver.py');spec=importlib.util.spec_from_file_location('mg14',p);m=importlib.util.module_from_spec(spec);sys.modules[spec.name]=m;spec.loader.exec_module(m)
          source=m.parse_equation('x = y * (x * (((z * y) * y) * y))'); target=m.parse_equation('x = y')
          def run(maxterm,age_every,seconds):
            limits=dict(m.COMPACT_SUPERPOSITION_PROBE);limits.update({'maximum_term_size':maxterm,'maximum_depth':12,'maximum_rules':800,'maximum_clauses':8000,'normalization_steps':64})
            eng=m.TargetGroundedRefutation(source,target,time.monotonic()+seconds,limits);s=eng.search
            def ors(c):
              o=s.orient(c)
              if o is not None:return[o]
              q=[]
              if c.lhs[0]!='var':q.append(c)
              if c.rhs[0]!='var':q.append(m.Recipe(c.rhs,c.lhs,'symmetry',(c,)))
              return q
            processed=set();active=[];tick=0;found=None;t0=time.monotonic()
            while time.monotonic()<s.deadline:
              av=[i for i in range(len(s.clauses)) if i not in processed]
              if not av:break
              tick+=1;idx=av[0] if tick%age_every==0 else min(av,key=lambda i:(m.term_size(s.clauses[i].lhs)+m.term_size(s.clauses[i].rhs),s.clauses[i].cost,i));processed.add(idx);grs=ors(s.clauses[idx]);simp=active+grs;pending=[]
              for gr in grs:
                for pi,ar in enumerate(active+[gr]):
                  for outer,inner,oi,ii in ((gr,ar,tick,pi),(ar,gr,pi,tick)):
                    for path in m.nonvariable_positions(outer.lhs,maximum_depth=12,include_root=True):
                      if time.monotonic()>=s.deadline:break
                      try:q=s.critical_pair(outer,inner,oi,ii,path)
                      except Exception:q=None
                      if q is None or max(m.term_size(q.lhs),m.term_size(q.rhs))>maxterm:continue
                      try:q=s.interreduce(q,simp)
                      except Exception:continue
                      if max(m.term_size(q.lhs),m.term_size(q.rhs))<=maxterm:pending.append(q)
                    if time.monotonic()>=s.deadline:break
                  if time.monotonic()>=s.deadline:break
                if time.monotonic()>= s.deadline:break
              pending.sort(key=lambda q:(m.term_size(q.lhs)+m.term_size(q.rhs),q.cost,s.target_score(q)))
              for q in pending:s.add_clause(q)
              active.extend(grs);found=s.target_proof(s.rules())
              if found is not None:break
            row={'maxterm':maxterm,'age_every':age_every,'elapsed':round(time.monotonic()-t0,4),'found':found is not None,'clauses':len(s.clauses),'processed':len(processed),'reductions':s.reductions,'max_cost':s.maximum_recipe_cost}
            print(json.dumps(row),flush=True);return row
          out=[run(mt,a,12.0) for mt,a in ((20,2),(25,2),(30,2),(25,3),(30,3))]
          Path('/tmp/0014_collapse.json').write_text(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: 0014-collapse
          path: /tmp/0014_collapse.json

name: MathGraph Vampire Oracle

on:
  push:
    branches:
      - mathgraph/perfect-solver-oracle-20260810

permissions:
  contents: read

jobs:
  trace-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Vampire 5.0.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/vampire.zip https://github.com/vprover/vampire/releases/download/v5.0.1/vampire-Linux-X64.zip
          unzip -j -o /tmp/vampire.zip -d /tmp
          chmod +x /tmp/vampire
      - name: Generate singleton proof
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/singleton.p <<'EOF'
          fof(source,axiom,(! [V_X,V_Y,V_Z] : V_X = f(f(V_Y,V_Z),f(f(V_X,f(V_X,V_Y)),V_Z)))).
          fof(target,conjecture,(! [V_A,V_B] : V_A = V_B)).
          EOF
          /tmp/vampire --mode casc --time_limit 20 --proof tptp /tmp/singleton.p > /tmp/vampire_singleton_proof.txt
          grep -q 'SZS status Theorem' /tmp/vampire_singleton_proof.txt
      - name: Dump MathGraph singleton retained clauses
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util,json,sys,time
          from pathlib import Path
          p=Path('submissions/mathgraph/solver.py')
          spec=importlib.util.spec_from_file_location('mgtrace',p)
          m=importlib.util.module_from_spec(spec); sys.modules[spec.name]=m; spec.loader.exec_module(m)
          source=m.parse_equation('x = (y * z) * ((x * (x * y)) * z)')
          target=m.parse_equation('x = y')
          limits=dict(m.COMPACT_SUPERPOSITION_PROBE)
          limits.update({'maximum_term_size':60,'maximum_replay_term_size':240,'maximum_depth':12,'maximum_rules':512,'maximum_rounds':40,'new_clauses_per_round':256,'maximum_clauses':8000,'normalization_steps':160,'maximum_proof_nodes':50000})
          eng=m.TargetGroundedRefutation(source,target,time.monotonic()+10.0,limits)
          found=eng.solve()
          rows=[]
          for i,c in enumerate(eng.search.clauses):
            rows.append({'i':i,'lhs':m.render_term(eng.inline(c.lhs)),'rhs':m.render_term(eng.inline(c.rhs)),'cost':c.cost,'score':eng.search.target_score(c)[:4]})
          Path('/tmp/mathgraph_singleton_clauses.json').write_text(json.dumps({'found':found is not None,'rounds':eng.search.rounds,'superpositions':eng.search.superpositions,'reductions':eng.search.reductions,'clauses':rows},indent=2))
          print('clauses',len(rows),'found',found is not None,'rounds',eng.search.rounds)
          PY
      - name: Upload trace diff inputs
        uses: actions/upload-artifact@v4
        with:
          name: singleton-trace-diff
          path: |
            /tmp/vampire_singleton_proof.txt
            /tmp/mathgraph_singleton_clauses.json

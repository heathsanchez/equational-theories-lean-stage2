name: MathGraph O5 Multisubstitution Decisive Dispatch
on:
  pull_request:
    branches: [mathgraph/residual-conditioned-operator-induction-20260821]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decisive:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'mathgraph/invariant-breaking-binary-congruence-20260821'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/invariant-breaking-binary-congruence-20260821
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=3,<5'
      - name: Run residual-unified multisubstitution
        run: python experiments/mathgraph/run_residual_unified_multisubstitution_gate.py
      - name: Run multisubstitution ratchet
        run: python experiments/mathgraph/run_residual_multisub_ratchet_gate.py
      - name: Persist decisive results to head branch
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/mathgraph/results/residual-unified-multisubstitution-gate.json experiments/mathgraph/results/residual-multisub-ratchet-gate.json 2>/dev/null || true
          git commit -m 'research: persist O5 multisubstitution decisive results [skip ci]' || true
          git push origin HEAD:mathgraph/invariant-breaking-binary-congruence-20260821 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-o5-multisubstitution-decisive
          path: |
            experiments/mathgraph/results/residual-unified-multisubstitution-gate.json
            experiments/mathgraph/results/residual-multisub-ratchet-gate.json
          if-no-files-found: warn

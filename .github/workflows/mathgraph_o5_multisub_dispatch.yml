name: MathGraph O5 Multisubstitution Ratchet Dispatch
on:
  pull_request:
    branches: [mathgraph/residual-conditioned-operator-induction-20260821]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decisive:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'mathgraph/invariant-breaking-binary-congruence-20260821'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/invariant-breaking-binary-congruence-20260821
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=3,<5'
      - name: Run multisubstitution ratchet fail-loud
        continue-on-error: true
        run: python experiments/mathgraph/run_residual_multisub_ratchet_safe.py
      - name: Persist ratchet result to head branch
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/mathgraph/results/residual-multisub-ratchet-gate.json 2>/dev/null || true
          git commit -m 'research: persist O5 multisub ratchet result [skip ci]' || true
          git pull --rebase origin mathgraph/invariant-breaking-binary-congruence-20260821 || true
          git push origin HEAD:mathgraph/invariant-breaking-binary-congruence-20260821 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-o5-multisub-ratchet
          path: experiments/mathgraph/results/residual-multisub-ratchet-gate.json
          if-no-files-found: warn

name: MathGraph Five Residual Inference Atlas

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  atlas:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.title == '[MathGraph Trigger] Schematic Closure Gate'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: mathgraph/superposition-selector-tournament-20260820
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install atlas dependencies
        run: python -m pip install 'datasets>=3,<5'
      - name: Run five-residual inference effect atlas
        run: python experiments/mathgraph/run_five_residual_inference_atlas.py
      - name: Upload inference atlas
        uses: actions/upload-artifact@v4
        with:
          name: mathgraph-five-residual-inference-atlas
          path: experiments/mathgraph/results/five-residual-inference-atlas.json
          if-no-files-found: error
          retention-days: 30

name: MathGraph 796 0040 f196 rematerialization fast
on:
  push:
    branches: [mathgraph/residual-router-796-20260826]
  workflow_dispatch:
jobs:
  remat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'openai>=1,<2'
      - name: Download official normal evaluation
        run: |
          mkdir -p /tmp/sair_eval
          curl -fL --retry 3 'https://huggingface.co/datasets/SAIRfoundation/equational-theories-selected-problems/resolve/main/data/evaluation_normal.jsonl' -o /tmp/sair_eval/evaluation_normal.jsonl
      - name: Run f196 rematerialization separator
        run: |
          python experiments/mathgraph/run_796_0040_materialize_overlap_continue.py \
            --input /tmp/sair_eval/evaluation_normal.jsonl \
            --output experiments/mathgraph/results/796-0040-f196-remat-fast.json
      - uses: actions/upload-artifact@v4
        with:
          name: mathgraph-796-0040-f196-remat-fast
          path: experiments/mathgraph/results/796-0040-f196-remat-fast.json
          if-no-files-found: error

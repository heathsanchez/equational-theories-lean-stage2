name: MathGraph 2666 Target Term Constructor

on:
  pull_request:
    paths:
      - experiments/mathgraph/run_2666_target_term_constructor.py
      - .github/workflows/mathgraph_2666_target_term_constructor.yml
  push:
    branches:
      - mathgraph/18-edge-constructor-separator-20260824
    paths:
      - experiments/mathgraph/run_2666_target_term_constructor.py
      - .github/workflows/mathgraph_2666_target_term_constructor.yml

permissions:
  contents: read

jobs:
  target-term-constructor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/18-edge-constructor-separator-20260824
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python experiments/mathgraph/run_2666_target_term_constructor.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathgraph-2666-target-term-constructor
          path: experiments/mathgraph/results/2666-target-term-constructor.json
          if-no-files-found: warn

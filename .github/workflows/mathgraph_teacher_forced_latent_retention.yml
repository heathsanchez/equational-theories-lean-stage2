name: MathGraph Teacher-Forced Latent Retention

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  retention:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.title == '[MathGraph Trigger] Teacher-Forced Latent Retention'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/superposition-selector-tournament-20260820
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=3,<5'
      - name: Run diagnostic latent-retention intervention
        run: python experiments/mathgraph/run_teacher_forced_latent_retention.py
      - uses: actions/upload-artifact@v4
        with:
          name: mathgraph-teacher-forced-latent-retention
          path: experiments/mathgraph/results/teacher-forced-latent-retention.json
          if-no-files-found: error
          retention-days: 30

name: MathGraph Hard0196 Matched Budget Gate
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:
jobs:
  matched-budget:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.title == '[MathGraph Trigger] Given Clause Saturation Gate')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/developmental-continuation-20260820
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=3,<5'
      - name: Run matched-budget causal gate
        run: python experiments/mathgraph/run_hard0196_matched_budget_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-hard0196-matched-budget-gate
          path: experiments/mathgraph/results/hard0196-matched-budget-gate.json
          if-no-files-found: warn
          retention-days: 30

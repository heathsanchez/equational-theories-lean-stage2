name: Normal0040 Common Specialization Causal Attack Stable Gate
on:
  pull_request:
    branches: [mathgraph/residual-factorization-base-20260821]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/residual-factorization-optimum-20260821
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=3,<5'
      - name: Verify frozen protocol predates executable
        run: |
          set -euo pipefail
          test "$(git rev-list --count 6c21250c2cb426b3ecd2f46a62697196c855a853..33b8ca731f11ef5d5e3a9f5e180bb6f7c5136b87)" -ge 1
          git show 6c21250c2cb426b3ecd2f46a62697196c855a853:experiments/mathgraph/protocols/normal0040-common-specialization-causal-attack-v1.json >/dev/null
      - name: Run common-specialization causal attack
        run: python experiments/mathgraph/run_normal0040_common_specialization_causal_attack_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: normal0040-common-specialization-causal-attack-v1
          path: experiments/mathgraph/results/normal0040-common-specialization-causal-attack-gate.json

name: MathGraph Residual Representation Tournament
on:
  push:
    branches: [mathgraph/residual-representation-tournament-20260821]
  workflow_dispatch:
jobs:
  tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run residual representation tournament
        run: python experiments/mathgraph/run_residual_representation_tournament.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-residual-representation-tournament
          path: experiments/mathgraph/results/residual-representation-tournament.json
          if-no-files-found: error
          retention-days: 30

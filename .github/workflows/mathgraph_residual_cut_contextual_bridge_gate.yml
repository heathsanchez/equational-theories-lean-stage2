name: MathGraph O5-0014 Representation Gate
on:
  push:
    branches: [mathgraph/o5-0014-representation-isolated-20260821]
  workflow_dispatch:
jobs:
  representation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=3,<5'
      - name: Run focused quotient matcher
        run: python experiments/mathgraph/run_order5_0014_quotient_matcher_gate.py
      - name: Scan for derived universal collapse
        if: always()
        run: python experiments/mathgraph/run_order5_0014_derived_collapse_scan.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-o5-0014-representation
          path: |
            experiments/mathgraph/results/order5-0014-quotient-matcher-gate.json
            experiments/mathgraph/results/order5-0014-derived-collapse-scan.json
          if-no-files-found: warn
          retention-days: 30

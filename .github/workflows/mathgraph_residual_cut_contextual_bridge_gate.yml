name: MathGraph O5-0014 Decisive Representation Bridge
on:
  push:
    branches: [mathgraph/o5-0014-decisive-bridge-20260821]
  pull_request:
    branches: [mathgraph/binary-fusion-isolated-20260821]
  workflow_dispatch:
jobs:
  decisive-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=3,<5'
      - name: Run bidirectional contextual BFS across residual cut
        run: python experiments/mathgraph/run_residual_cut_bidirectional_context_bfs_gate.py
      - name: Run residual-derived contextual critical pairs
        if: always()
        run: python experiments/mathgraph/run_residual_cut_critical_pair_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-o5-0014-decisive-bridge
          path: |
            experiments/mathgraph/results/residual-cut-bidirectional-context-bfs-gate.json
            experiments/mathgraph/results/residual-cut-critical-pair-gate.json
          if-no-files-found: warn
          retention-days: 30

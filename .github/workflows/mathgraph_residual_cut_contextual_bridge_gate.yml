name: MathGraph Residual Representation Tournament
on:
  pull_request:
    branches: [mathgraph/residual-tournament-base-20260821]
  workflow_dispatch:
jobs:
  tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run residual representation tournament
        run: python experiments/mathgraph/run_residual_representation_tournament.py
      - name: Replicate tournament on FIN3 lineage
        run: python experiments/mathgraph/run_residual_representation_fin3_replication.py
      - name: Run leakage-free structural/operational ablation
        run: python experiments/mathgraph/run_residual_representation_leakage_ablation.py
      - name: Inventory representation-change events
        run: python experiments/mathgraph/run_residual_event_inventory.py
      - name: Run frozen-threshold external validation
        run: python experiments/mathgraph/run_residual_atlas_external_validation.py
      - name: Inventory historical residual experiments
        run: python experiments/mathgraph/run_residual_atlas_inventory.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-residual-representation-tournament
          path: |
            experiments/mathgraph/results/residual-representation-tournament.json
            experiments/mathgraph/results/residual-representation-fin3-replication.json
            experiments/mathgraph/results/residual-representation-leakage-ablation.json
            experiments/mathgraph/results/residual-event-inventory.json
            experiments/mathgraph/results/residual-atlas-external-validation.json
            experiments/mathgraph/results/residual-atlas-inventory.json
          if-no-files-found: error
          retention-days: 30

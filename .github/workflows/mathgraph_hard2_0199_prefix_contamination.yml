name: MathGraph hard2_0199 Prefix Contamination

on:
  push:
    branches:
      - mathgraph/18-edge-constructor-separator-20260824
    paths:
      - experiments/mathgraph/run_hard2_0199_prefix_contamination.py
      - .github/workflows/mathgraph_hard2_0199_prefix_contamination.yml
  pull_request:
    paths:
      - experiments/mathgraph/run_hard2_0199_prefix_contamination.py
      - .github/workflows/mathgraph_hard2_0199_prefix_contamination.yml

permissions:
  contents: read

jobs:
  prefix-contamination:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/18-edge-constructor-separator-20260824
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run prefix contamination localization
        run: python experiments/mathgraph/run_hard2_0199_prefix_contamination.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-hard2-0199-prefix-contamination
          path: experiments/mathgraph/results/hard2-0199-prefix-contamination.json
          if-no-files-found: warn

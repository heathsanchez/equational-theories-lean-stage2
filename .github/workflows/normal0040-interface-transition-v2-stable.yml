name: Normal0040 Interface Transition V2 Stable Gate
on:
  pull_request:
    branches: [mathgraph/residual-factorization-base-20260821]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/residual-factorization-optimum-20260821
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=3,<5'
      - name: Verify frozen protocol predates executable
        run: |
          set -euo pipefail
          test "$(git rev-list --count 966ed50d7b203931db8dc000def7ae28147dec30..96be73b0e80bd86a48dc5027a21b22d821466c2e)" -ge 1
          git show 966ed50d7b203931db8dc000def7ae28147dec30:experiments/mathgraph/protocols/normal0040-interface-transition-v2.json >/dev/null
      - name: Run audited 5x5 second-order interface transition probe
        run: python experiments/mathgraph/run_normal0040_interface_transition_v2_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: normal0040-interface-transition-v2
          path: experiments/mathgraph/results/normal0040-interface-transition-v2-gate.json

name: MathGraph Residual Multisub Ratchet Gate
on:
  pull_request:
    branches: [mathgraph/residual-conditioned-operator-induction-20260821]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/invariant-breaking-binary-congruence-20260821
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=3,<5'
      - name: Run residual multisubstitution ratchet
        run: python experiments/mathgraph/run_residual_multisub_ratchet_gate.py
      - name: Persist result
        if: always()
        shell: bash
        run: |
          if [ -f experiments/mathgraph/results/residual-multisub-ratchet-gate.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add experiments/mathgraph/results/residual-multisub-ratchet-gate.json
            git commit -m 'research: persist residual multisub ratchet result [skip ci]' || true
            git push origin HEAD:mathgraph/invariant-breaking-binary-congruence-20260821 || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-residual-multisub-ratchet
          path: experiments/mathgraph/results/residual-multisub-ratchet-gate.json
          if-no-files-found: warn

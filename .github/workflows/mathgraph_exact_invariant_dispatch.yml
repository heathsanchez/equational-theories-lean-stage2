name: MathGraph Exact Invariant Dispatch
on:
  push:
    branches: [mathgraph/exact-invariant-dispatch-20260821]
  workflow_dispatch:
jobs:
  invariant-extraction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=3,<5'
      - run: python experiments/mathgraph/run_exact_generative_invariant_extraction.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-exact-invariant-dispatch
          path: experiments/mathgraph/results/exact-generative-invariant-extraction.json
          if-no-files-found: warn
          retention-days: 30

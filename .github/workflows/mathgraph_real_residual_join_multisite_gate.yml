name: MathGraph Real Residual JOIN Multisite Gate

on:
  pull_request:
    paths:
      - 'experiments/mathgraph/REAL_RESIDUAL_FIELD_JOIN_FREEZE_20260821.json'
      - 'experiments/mathgraph/run_real_residual_join_multisite_gate.py'
      - '.github/workflows/mathgraph_real_residual_join_multisite_gate.yml'

concurrency:
  group: mathgraph-real-residual-join-multisite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-residual-join-multisite:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=3,<5'
      - name: Run frozen residual-field JOIN intervention
        run: python experiments/mathgraph/run_real_residual_join_multisite_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: mathgraph-real-residual-join-multisite
          path: experiments/mathgraph/results/real-residual-join-multisite-gate.json

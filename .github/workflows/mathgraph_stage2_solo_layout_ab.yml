name: MathGraph Stage2 Solo layout A-B reproducer

on:
  push:
    branches:
      - mathgraph/stage2-gemma-5-errors-v1
    paths:
      - .github/workflows/mathgraph_stage2_solo_layout_ab.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    name: ${{ matrix.mode }} main row ${{ matrix.position }}
    strategy:
      fail-fast: false
      matrix:
        mode: [clean, pycache]
        position: [1, 3, 11, 34, 41, 50]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/stage2-gemma-5-errors-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install proxy dependency
        run: python -m pip install 'openai>=1,<2'
      - name: Pin official Lean and Mathlib
        run: |
          printf '%s\n' 'leanprover/lean4:v4.32.2' > lean-toolchain
          python - <<'PY'
          from pathlib import Path
          p=Path('lakefile.lean')
          s=p.read_text()
          old='896cc56a395e1615786fac56564a3fe6bfeebcc4'
          new='905b95818eb32af7874a58b427f50c1711a5e96c'
          if old in s:
              p.write_text(s.replace(old,new))
          elif new not in s:
              raise SystemExit('expected Mathlib pin not found')
          PY
          rm -f lake-manifest.json
      - name: Set up exact official Lean judge
        env:
          SKIP_DOCKER: '1'
        run: bash scripts/setup.sh
      - name: Confirm exact solver identity
        run: |
          test "$(wc -c < submissions/mathgraph_solo_hybrid/solver.py)" -eq 423718
          test "$(sha256sum submissions/mathgraph_solo_hybrid/solver.py | awk '{print $1}')" = '42c96092bad4b03ce13ab80df927675b65ab65225bff1d971ff328949a6ef7f4'
          test "$(find submissions/mathgraph_solo_hybrid -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
      - name: Fetch released Stage 2 main evaluation
        run: |
          mkdir -p /tmp/sair_eval
          curl -fL --retry 3 'https://huggingface.co/datasets/SAIRfoundation/equational-theories-selected-problems/resolve/main/data/stage2_evaluation_main.jsonl' -o /tmp/sair_eval/stage2_evaluation_main.jsonl
          test "$(wc -l < /tmp/sair_eval/stage2_evaluation_main.jsonl)" -eq 200
      - name: Apply only experimental layout difference
        run: |
          if [ '${{ matrix.mode }}' = pycache ]; then
            python -m py_compile submissions/mathgraph_solo_hybrid/solver.py
            test -d submissions/mathgraph_solo_hybrid/__pycache__
          else
            rm -rf submissions/mathgraph_solo_hybrid/__pycache__
          fi
          echo "submission directory:"
          find submissions/mathgraph_solo_hybrid -mindepth 1 -maxdepth 2 -printf '%P\n' | sort
      - name: Replay same exact solver and row
        run: |
          unset OPENROUTER_API_KEY OPENAI_API_KEY
          source .env.judge
          python experiments/mathgraph/run_stage2_gemma_error_solo.py \
            --dataset /tmp/sair_eval/stage2_evaluation_main.jsonl \
            --position '${{ matrix.position }}' \
            --timeout 3600 \
            --output "experiments/mathgraph/results/layout-ab-${{ matrix.mode }}-${{ matrix.position }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-ab-${{ matrix.mode }}-${{ matrix.position }}
          path: experiments/mathgraph/results/layout-ab-${{ matrix.mode }}-${{ matrix.position }}.json
          if-no-files-found: warn

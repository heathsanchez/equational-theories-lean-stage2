name: MathGraph f126 replay diagnostic
on:
  push:
    branches: [mathgraph/f126-replay-diagnostic-20260826]
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'openai>=1,<2'
      - name: Setup Lean judge
        env:
          SKIP_DOCKER: '1'
        run: bash scripts/setup.sh
      - name: Download official normal evaluation
        run: |
          mkdir -p /tmp/sair_eval
          curl -fL --retry 3 'https://huggingface.co/datasets/SAIRfoundation/equational-theories-selected-problems/resolve/main/data/evaluation_normal.jsonl' -o /tmp/sair_eval/evaluation_normal.jsonl
      - name: Diagnose f126 replay
        run: |
          source .env.judge
          python experiments/mathgraph/run_f126_replay_diagnostic.py \
            --input /tmp/sair_eval/evaluation_normal.jsonl \
            --output experiments/mathgraph/results/f126-replay-diagnostic.json
      - uses: actions/upload-artifact@v4
        with:
          name: mathgraph-f126-replay-diagnostic
          path: experiments/mathgraph/results/f126-replay-diagnostic.json
          if-no-files-found: error

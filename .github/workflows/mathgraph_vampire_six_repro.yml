name: MathGraph Vampire Six Residual Reproduction

on:
  push:
    branches:
      - mathgraph/vampire-six-repro-20260820
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: mathgraph/vampire-six-repro-20260820

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dataset tooling and Vampire
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'datasets>=3,<5'
          sudo apt-get update
          sudo apt-get install -y curl jq unzip file
          curl -fsSL https://api.github.com/repos/vprover/vampire/releases/latest -o /tmp/vampire-release.json
          jq -r '.tag_name, (.assets[] | .name)' /tmp/vampire-release.json
          python - <<'PY' >/tmp/vampire-url.txt
          import json
          r=json.load(open('/tmp/vampire-release.json'))
          assets=r.get('assets',[])
          ranked=[]
          for a in assets:
              n=a['name'].lower()
              score=0
              if 'linux' in n: score += 10
              if 'x86_64' in n or 'amd64' in n or 'x64' in n: score += 6
              if 'z3' in n: score += 2
              if any(x in n for x in ('source','src','darwin','mac','windows','cygwin')): score -= 20
              ranked.append((score,a['browser_download_url'],a['name']))
          ranked.sort(reverse=True)
          if not ranked or ranked[0][0] < 10:
              raise SystemExit('No suitable Linux Vampire release asset found: '+repr([a['name'] for a in assets]))
          print(ranked[0][1])
          print('selected:', ranked[0][2], file=__import__('sys').stderr)
          PY
          curl -fL "$(cat /tmp/vampire-url.txt)" -o /tmp/vampire-asset
          mkdir -p /tmp/vampire-bin
          kind="$(file -b /tmp/vampire-asset)"
          echo "$kind"
          if echo "$kind" | grep -qi 'Zip archive'; then
            unzip -q /tmp/vampire-asset -d /tmp/vampire-bin
          elif echo "$kind" | grep -Eqi 'gzip|tar archive|XZ compressed'; then
            tar -xf /tmp/vampire-asset -C /tmp/vampire-bin
          else
            cp /tmp/vampire-asset /tmp/vampire-bin/vampire
          fi
          VAMPIRE_PATH="$(find /tmp/vampire-bin -type f \( -name vampire -o -name 'vampire*' \) | head -1)"
          test -n "$VAMPIRE_PATH"
          chmod +x "$VAMPIRE_PATH"
          sudo install -m 0755 "$VAMPIRE_PATH" /usr/local/bin/vampire
          vampire --show_options on >/dev/null

      - name: Extract the six released evaluation residuals
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from datasets import load_dataset

          wanted = {
              'evaluation_normal_0036',
              'evaluation_normal_0040',
              'evaluation_normal_0158',
              'evaluation_hard_0196',
              'evaluation_order5_0014',
              'evaluation_order5_0042',
          }
          configs = ['evaluation_normal', 'evaluation_hard', 'evaluation_order5']
          found = {}
          for config in configs:
              ds = load_dataset('SAIRfoundation/equational-theories-selected-problems', config, split='train')
              for row in ds:
                  if row.get('id') in wanted:
                      found[row['id']] = dict(row)

          missing = sorted(wanted - set(found))
          if missing:
              raise SystemExit(f'Missing residual rows: {missing}')

          rows = [found[k] for k in sorted(found)]
          with open('/tmp/mathgraph-six-residuals.json', 'w') as f:
              json.dump(rows, f, indent=2)
          print(json.dumps(rows, indent=2))
          PY

      - name: Run committed Vampire residual diagnostic
        shell: bash
        run: |
          set -euxo pipefail
          python experiments/mathgraph/run_vampire_residual_research.py \
            --input /tmp/mathgraph-six-residuals.json \
            --output mathgraph-six-vampire.json \
            --seconds 10
          python - <<'PY'
          import json
          p=json.load(open('mathgraph-six-vampire.json'))
          rows=p['rows']
          print('\nSUMMARY')
          for r in rows:
              print(r['id'], 'theorem=', r['theorem'], 'seconds=', r['seconds'], 'proof_lines=', r['proof_lines'], 'superposition=', r['superposition_steps'], 'demodulation=', r['demodulation_steps'])
          solved=sum(bool(r['theorem']) for r in rows)
          print(f'SOLVED={solved}/{len(rows)}')
          if solved != len(rows):
              raise SystemExit(1)
          PY

      - name: Write compact proof-shape report
        shell: bash
        run: |
          python - <<'PY'
          import collections, json, re
          p=json.load(open('mathgraph-six-vampire.json'))
          out=[]
          for r in p['rows']:
              proof=r.get('proof') or ''
              inf=collections.Counter(re.findall(r'inference\(([^,\]]+)', proof))
              out.append({
                  'id': r['id'],
                  'seconds': r['seconds'],
                  'proof_lines': r['proof_lines'],
                  'superposition_steps': r['superposition_steps'],
                  'demodulation_steps': r['demodulation_steps'],
                  'inference_histogram': dict(sorted(inf.items())),
              })
          json.dump({'rows':out}, open('mathgraph-six-vampire-proof-shapes.json','w'), indent=2)
          print(json.dumps(out, indent=2))
          PY

      - name: Upload proof traces
        uses: actions/upload-artifact@v4
        with:
          name: mathgraph-vampire-six-residuals
          path: |
            mathgraph-six-vampire.json
            mathgraph-six-vampire-proof-shapes.json
          if-no-files-found: error

      - name: Persist successful traces on research branch
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p experiments/mathgraph/results/vampire-six-20260820
          cp mathgraph-six-vampire.json experiments/mathgraph/results/vampire-six-20260820/
          cp mathgraph-six-vampire-proof-shapes.json experiments/mathgraph/results/vampire-six-20260820/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- experiments/mathgraph/results/vampire-six-20260820/mathgraph-six-vampire.json experiments/mathgraph/results/vampire-six-20260820/mathgraph-six-vampire-proof-shapes.json
          if git diff --cached --quiet; then
            echo 'No trace changes to persist.'
          else
            git commit -m 'chore(research): persist Vampire six traces [skip ci]'
            git push origin HEAD:mathgraph/vampire-six-repro-20260820
          fi

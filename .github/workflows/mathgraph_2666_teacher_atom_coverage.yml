name: MathGraph 2666 Teacher Atom Coverage

on:
  pull_request:
    paths:
      - experiments/mathgraph/run_2666_teacher_atom_coverage.py
      - .github/workflows/mathgraph_2666_teacher_atom_coverage.yml
  push:
    branches:
      - mathgraph/18-edge-constructor-separator-20260824
    paths:
      - experiments/mathgraph/run_2666_teacher_atom_coverage.py
      - .github/workflows/mathgraph_2666_teacher_atom_coverage.yml

permissions:
  contents: read

jobs:
  atom-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/18-edge-constructor-separator-20260824
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python experiments/mathgraph/run_2666_teacher_atom_coverage.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathgraph-2666-teacher-atom-coverage
          path: experiments/mathgraph/results/2666-teacher-atom-coverage.json
          if-no-files-found: warn

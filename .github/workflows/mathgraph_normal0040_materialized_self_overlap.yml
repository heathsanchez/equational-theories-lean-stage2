name: MathGraph normal0040 materialized self-overlap
on:
  push:
    branches:
      - mathgraph/normal0040-materialized-self-overlap-20260826
permissions:
  contents: read
jobs:
  normal0040-materialized-self-overlap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch evaluation data
        run: |
          mkdir -p /tmp/sair_stage1_eval
          curl -fL --retry 3 'https://huggingface.co/datasets/SAIRfoundation/equational-theories-selected-problems/resolve/main/data/evaluation_normal.jsonl' -o /tmp/sair_stage1_eval/evaluation_normal.jsonl
          curl -fL --retry 3 'https://huggingface.co/datasets/SAIRfoundation/equational-theories-selected-problems/resolve/main/data/evaluation_hard.jsonl' -o /tmp/sair_stage1_eval/evaluation_hard.jsonl
      - name: Compile source-reentry scheduler
        run: python -m py_compile experiments/mathgraph/run_source_reentry_scheduler_transfer.py
      - name: Run narrow source-reentry scheduler transfer
        run: |
          python experiments/mathgraph/run_source_reentry_scheduler_transfer.py \
            --normal-input /tmp/sair_stage1_eval/evaluation_normal.jsonl \
            --hard-input /tmp/sair_stage1_eval/evaluation_hard.jsonl \
            --output experiments/mathgraph/results/source-reentry-scheduler-transfer.json
      - uses: actions/upload-artifact@v4
        with:
          name: source-reentry-scheduler-transfer
          path: experiments/mathgraph/results/source-reentry-scheduler-transfer.json
          if-no-files-found: error

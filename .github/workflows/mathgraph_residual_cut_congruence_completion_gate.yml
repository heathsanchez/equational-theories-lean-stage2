name: MathGraph Residual Cut Congruence Completion Gate
on:
  push:
    branches: [mathgraph/binary-fusion-isolated-20260821]
  pull_request:
    branches: [mathgraph/residual-conditioned-operator-induction-20260821]
  workflow_dispatch:
jobs:
  congruence-cut:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=3,<5'
      - name: Run residual-cut congruence completion
        run: python experiments/mathgraph/run_residual_cut_congruence_completion_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-residual-cut-congruence-completion
          path: experiments/mathgraph/results/residual-cut-congruence-completion-gate.json
          if-no-files-found: warn
          retention-days: 30

name: MathGraph Cut Attachment Audit PR7
on:
  pull_request:
    branches: [mathgraph/isolated-actions-base-20260821]
    paths:
      - 'experiments/mathgraph/run_cut_attachment_audit.py'
      - '.github/workflows/mathgraph_cut_attachment_audit_pr7.yml'
  workflow_dispatch:
jobs:
  cut-attachment:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'datasets>=3,<5'
      - name: Run cut attachment audit
        run: python experiments/mathgraph/run_cut_attachment_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-cut-attachment-audit-pr7
          path: experiments/mathgraph/results/cut-attachment-audit.json

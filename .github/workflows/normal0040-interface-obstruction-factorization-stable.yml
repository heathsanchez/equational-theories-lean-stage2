name: Normal0040 Interface Obstruction Factorization Stable Gate
on:
  pull_request:
    branches: [mathgraph/residual-factorization-base-20260821]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/residual-factorization-optimum-20260821
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=3,<5'
      - name: Verify frozen protocol predates executable
        run: |
          set -euo pipefail
          test "$(git rev-list --count 9fe593701d641c2147c846dfe7134bce498cf3a9..3f78b319127c6b022214e6134d8de6d27b2514c7)" -ge 1
          git show 9fe593701d641c2147c846dfe7134bce498cf3a9:experiments/mathgraph/protocols/normal0040-interface-obstruction-factorization-v1.json >/dev/null
      - name: Run interface obstruction factorization
        run: python experiments/mathgraph/run_normal0040_interface_obstruction_factorization_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: normal0040-interface-obstruction-factorization-v1
          path: experiments/mathgraph/results/normal0040-interface-obstruction-factorization-gate.json

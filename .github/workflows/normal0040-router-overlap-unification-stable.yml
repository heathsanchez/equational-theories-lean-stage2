name: Normal0040 Router Overlap Unification Stable Gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [mathgraph/residual-factorization-base-20260821]
permissions:
  contents: read
jobs:
  gate:
    if: github.head_ref == 'mathgraph/residual-factorization-optimum-20260821'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/residual-factorization-optimum-20260821
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=3,<5'
      - name: Verify protocol predates executable gate
        run: |
          test "$(git rev-list --count 3f6ce43b51878e43e23eccd7a20fcf5fdb69c217..13b3e7e46fda9a7ee9cfb957bdfd20f3c494ad50)" -ge 1
          git show 3f6ce43b51878e43e23eccd7a20fcf5fdb69c217:experiments/mathgraph/protocols/normal0040-router-overlap-unification-v1.json >/dev/null
      - name: Run router-selected overlap/unification gate
        run: python experiments/mathgraph/run_normal0040_router_overlap_unification_gate_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: normal0040-router-overlap-unification
          path: experiments/mathgraph/results/normal0040-router-overlap-unification-gate.json

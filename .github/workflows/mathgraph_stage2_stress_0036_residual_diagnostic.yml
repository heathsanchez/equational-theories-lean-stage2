name: MathGraph fresh stress 0036 residual diagnostic

on:
  push:
    branches: [mathgraph/stress-0036-residual-20260831]
    paths:
      - '.github/workflows/mathgraph_stage2_stress_0036_residual_diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      FROZEN_SHA256: f039604f35f03b9c2caf20226e54250777653554093443d205fd2fcd9558f404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild and verify untouched frozen solver
        run: |
          set -euo pipefail
          python experiments/mathgraph/build_behavioural_future_specialist.py \
            --base submissions/mathgraph/solver.py --output /tmp/solver.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/solver.py'); s=p.read_text()
          a='frontier_seconds = min(12.0, max(0.5, timeout / 40.0))'
          b='given_seconds = min(5.0, max(0.5, timeout / 80.0))'
          assert s.count(a)==1 and s.count(b)==1
          p.write_text(s.replace(a,'frontier_seconds = 30.0').replace(b,'given_seconds = 10.0'))
          PY
          python experiments/mathgraph/determinize_solver_order.py /tmp/solver.py
          test "$(sha256sum /tmp/solver.py | awk '{print $1}')" = "$FROZEN_SHA256"
          test "$(wc -c < /tmp/solver.py | tr -d ' ')" = '339289'
          python -m py_compile /tmp/solver.py
          rm -rf /tmp/__pycache__
          echo "DIAGNOSTIC_BASELINE sha256=$(sha256sum /tmp/solver.py | awk '{print $1}') bytes=$(wc -c < /tmp/solver.py | tr -d ' ')"

      - name: Instrument streaming cross recognition
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/solver.py'); s=p.read_text()
          needle='''                                cross_enumerated += 1\n                                raw.append((frontier.target_score(candidate), candidate))\n'''
          repl='''                                cross_enumerated += 1\n                                endpoints = (candidate.lhs, candidate.rhs)\n                                if endpoints == target[:2] or endpoints == (target[1], target[0]):\n                                    print(\n                                        "MATHGRAPH_DIAGNOSTIC " + json.dumps({\n                                            "stage": "streaming-cross",\n                                            "direct_target_hit": True,\n                                            "cross_index": cross_enumerated,\n                                            "left_index": left_index,\n                                            "right_index": right_index,\n                                            "first_reverse": first_reverse,\n                                            "second_reverse": second_reverse,\n                                            "path": list(path),\n                                        }, separators=(",", ":")),\n                                        file=sys.stderr, flush=True,\n                                    )\n                                    raise SystemExit(0)\n                                raw.append((frontier.target_score(candidate), candidate))\n'''
          assert s.count(needle)==1
          s=s.replace(needle,repl,1)
          needle2='''        raw.sort(key=lambda item: item[0])\n        candidates = []\n'''
          repl2='''        print(\n            "MATHGRAPH_DIAGNOSTIC " + json.dumps({\n                "stage": "streaming-cross-complete",\n                "direct_target_hit": False,\n                "cross_enumerated": cross_enumerated,\n                "raw_count": len(raw),\n            }, separators=(",", ":")),\n            file=sys.stderr, flush=True,\n        )\n        raise SystemExit(0)\n        raw.sort(key=lambda item: item[0])\n        candidates = []\n'''
          assert s.count(needle2)==1
          s=s.replace(needle2,repl2,1)
          compile(s,str(p),'exec'); p.write_text(s)
          PY

      - name: Fetch fresh stress row
        run: |
          set -euo pipefail
          curl -fL --retry 4 \
            'https://huggingface.co/datasets/SAIRfoundation/equational-theories-selected-problems/resolve/main/data/stage2_stress_test.jsonl' \
            -o /tmp/stress.jsonl
          python - <<'PY'
          import json
          rows=[json.loads(x) for x in open('/tmp/stress.jsonl')]
          row=next(r for r in rows if r['id']=='order5_normal_0036')
          assert row['answer'] is True
          print('FRESH_RESIDUAL_ROW '+json.dumps(row,sort_keys=True),flush=True)
          open('/tmp/row.json','w').write(json.dumps(row))
          PY

      - name: Run streaming target census
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util, json
          row=json.load(open('/tmp/row.json'))
          spec=importlib.util.spec_from_file_location('mgdiag','/tmp/solver.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          mod.judge=lambda verdict,code: {'status':'accepted'}
          source=mod.parse_equation(row['equation1'])
          target=mod.parse_equation(row['equation2'])
          mod.run_behavioural_future_fallback(source,target,3600)
          PY

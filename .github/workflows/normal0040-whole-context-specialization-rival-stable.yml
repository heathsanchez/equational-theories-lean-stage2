name: Normal0040 Whole Context Specialization Rival Stable Gate
on:
  pull_request:
    branches: [mathgraph/residual-factorization-base-20260821]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/residual-factorization-optimum-20260821
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=3,<5'
      - name: Verify frozen protocol predates executable
        run: |
          set -euo pipefail
          test "$(git rev-list --count 5d737ff4942cf6dd6e8ccee9f1b8413668d64b70..dfcb2053fdd4890fca551b0c68684e9f2eb405d9)" -ge 1
          git show 5d737ff4942cf6dd6e8ccee9f1b8413668d64b70:experiments/mathgraph/protocols/normal0040-whole-context-specialization-rival-v1.json >/dev/null
      - name: Run whole-context specialization rival
        run: python experiments/mathgraph/run_normal0040_whole_context_specialization_rival_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: normal0040-whole-context-specialization-rival-v1
          path: experiments/mathgraph/results/normal0040-whole-context-specialization-rival-gate.json

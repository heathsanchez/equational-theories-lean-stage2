name: MathGraph Verified Self Embedding Gate
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:
jobs:
  selfembed:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/developmental-continuation-20260820
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=3,<5'
      - name: Run verifier-gated self-embedding contraction invention
        run: python experiments/mathgraph/run_verified_self_embedding_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-verified-self-embedding-gate
          path: experiments/mathgraph/results/verified-self-embedding-gate.json
          if-no-files-found: warn
          retention-days: 30

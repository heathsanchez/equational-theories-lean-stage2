name: Normal0040 Continuation Interface Depth3 Stable Gate
on:
  pull_request:
    branches: [mathgraph/residual-factorization-base-20260821]
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/residual-factorization-optimum-20260821
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=3,<5'
      - name: Verify protocol predates executable
        run: |
          set -euo pipefail
          test "$(git rev-list --count 282a7b9cc3c754299d085871b8a3d8e8b9cfbbe9..1dc868cc4e49e1ec98317b656d47ed6c03899e90)" -ge 1
          git show 282a7b9cc3c754299d085871b8a3d8e8b9cfbbe9:experiments/mathgraph/protocols/normal0040-continuation-interface-depth3-v1.json >/dev/null
      - name: Run continuation-interface depth3 probe
        run: python experiments/mathgraph/run_normal0040_continuation_interface_depth3_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: normal0040-continuation-interface-depth3
          path: experiments/mathgraph/results/normal0040-continuation-interface-depth3-gate.json

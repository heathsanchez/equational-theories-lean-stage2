name: MathGraph production adaptive arity 0036

on:
  push:
    branches: [mathgraph/stress-0036-residual-20260831]
    paths:
      - 'experiments/mathgraph/build_adaptive_arity_specialist.py'
      - '.github/workflows/mathgraph_stage2_adaptive_arity_0036.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: '0'
      OFFICIAL_REPO_SHA: 817a4653bf762584931d49c6714c9fcfab7df66a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build deterministic adaptive candidate
        shell: bash
        run: |
          set -euo pipefail
          python experiments/mathgraph/build_adaptive_arity_specialist.py \
            --base submissions/mathgraph/solver.py --output /tmp/solver.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/solver.py'); s=p.read_text()
          a='frontier_seconds = min(12.0, max(0.5, timeout / 40.0))'
          b='given_seconds = min(5.0, max(0.5, timeout / 80.0))'
          assert s.count(a)==1 and s.count(b)==1
          p.write_text(s.replace(a,'frontier_seconds = 30.0').replace(b,'given_seconds = 10.0'))
          PY
          python experiments/mathgraph/determinize_solver_order.py /tmp/solver.py
          python -m py_compile /tmp/solver.py
          bytes=$(wc -c < /tmp/solver.py | tr -d ' ')
          test "$bytes" -le 500000
          echo "ADAPTIVE_SOLVER sha256=$(sha256sum /tmp/solver.py | awk '{print $1}') bytes=$bytes"
      - name: Checkout pinned official harness
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/SAIRcompetition/equational-theories-lean-stage2.git /tmp/official
          cd /tmp/official
          git checkout "$OFFICIAL_REPO_SHA"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.33.1'
          grep -q '0df444a360eaa60ab8c11dca51a86af692955474' lake-manifest.json
          mkdir -p submissions/mathgraph_adaptive
          cp /tmp/solver.py submissions/mathgraph_adaptive/solver.py
      - name: Setup pinned official Lean judge
        working-directory: /tmp/official
        env:
          SKIP_DOCKER: '1'
        run: bash scripts/setup.sh
      - name: Install proxy dependency
        working-directory: /tmp/official
        run: python -m pip install 'openai>=1,<3'
      - name: Fetch stress row 0036
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 \
            'https://huggingface.co/datasets/SAIRfoundation/equational-theories-selected-problems/resolve/main/data/stage2_stress_test.jsonl' \
            -o /tmp/stress.jsonl
      - name: Run actual adaptive solver through official proxy and judge
        working-directory: /tmp/official
        shell: bash
        run: |
          set -euo pipefail
          source .env.judge
          python - <<'PY'
          import json, sys, time
          from pathlib import Path
          ROOT=Path('/tmp/official'); sys.path.insert(0,str(ROOT))
          from pipeline.proxy import load_config, load_problems, run_solver
          rows=load_problems('/tmp/stress.jsonl')
          row=next(r for r in rows if r['id']=='order5_normal_0036')
          cfg=load_config(); cfg.setdefault('sandbox',{})['mode']='none'
          trace=[]; t0=time.monotonic()
          result=run_solver(ROOT/'submissions/mathgraph_adaptive',row,cfg,trace_hook=lambda e: trace.append(e))
          judges=[x for x in trace if x.get('type')=='judge']
          statuses=[(x.get('response') or {}).get('status') for x in judges]
          print('ADAPTIVE_0036_RESULT',json.dumps({
            'elapsed_seconds':round(time.monotonic()-t0,3),
            'solved':bool(result.get('solved')),
            'verdict':result.get('verdict'),
            'judge_calls':result.get('judge_calls',0),
            'judge_statuses':statuses,
            'llm_calls':result.get('llm_calls',0),
          },sort_keys=True),flush=True)
          PY

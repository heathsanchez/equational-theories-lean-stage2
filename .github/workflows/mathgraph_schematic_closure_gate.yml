name: MathGraph Schematic Grounded Closure Gate

on:
  push:
    branches:
      - mathgraph/schematic-closure-rerun-cedc5c3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/schematic-closure-rerun-cedc5c3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin tested code to requested commit
        run: |
          git checkout cedc5c3c7eb720f266dda682e57453b2495f72e8 -- submissions/mathgraph/solver.py experiments/mathgraph/apply_schematic_grounded_closure_patch.py
      - name: Install dataset tooling
        run: python -m pip install 'datasets>=3,<5'
      - name: Apply research patch
        run: python experiments/mathgraph/apply_schematic_grounded_closure_patch.py
      - name: Run three-case causal gate
        run: |
          python - <<'PY'
          import importlib.util, json, sys, time
          from datasets import load_dataset
          spec=importlib.util.spec_from_file_location('mg','submissions/mathgraph/solver.py')
          m=importlib.util.module_from_spec(spec); sys.modules['mg']=m; spec.loader.exec_module(m)
          wanted={'evaluation_extra_hard_0143','evaluation_extra_hard_0036','evaluation_normal_0036'}
          rows=[]
          for cfg in ['evaluation_normal','evaluation_extra_hard']:
              rows += [dict(r) for r in load_dataset('SAIRfoundation/equational-theories-selected-problems',cfg,split='train') if r.get('id') in wanted]
          limits=dict(m.COMPACT_SUPERPOSITION_PROBE)
          limits.update({'seconds':0.5,'maximum_term_size':45,'maximum_replay_term_size':160,'maximum_depth':10,'maximum_rules':192,'maximum_rounds':16,'new_clauses_per_round':128,'maximum_clauses':2000,'normalization_steps':96,'maximum_proof_nodes':20000})
          out=[]
          for row in sorted(rows,key=lambda r:r['id']):
              src=m.parse_equation(row['equation1']); tgt=m.parse_equation(row['equation2'])
              eng=m.TargetGroundedRefutation(src,tgt,time.monotonic()+10.0,limits)
              found=eng.solve()
              ok=False; nodes=root=None
              if found is not None:
                  nodes,root=found
                  ok=(nodes[root].lhs,nodes[root].rhs)==tgt[:2] and m.replay_dag(src,nodes,root,maximum_term_size=limits['maximum_replay_term_size'],maximum_nodes=limits['maximum_proof_nodes'])
              out.append({'id':row['id'],'found':bool(found),'replay_ok':bool(ok),'clauses':len(eng.search.clauses),'rounds':eng.search.rounds,'superpositions':eng.search.superpositions})
          summary={x['id']:x for x in out}
          result={'tested_commit':'cedc5c3c7eb720f266dda682e57453b2495f72e8','rows':out,'gate':{
              '0143_closed': summary['evaluation_extra_hard_0143']['replay_ok'],
              '0036_extra_stays_open': not summary['evaluation_extra_hard_0036']['found'],
              '0036_normal_stays_open': not summary['evaluation_normal_0036']['found'],
          }}
          result['gate']['pass']=all(result['gate'].values())
          open('experiments/mathgraph/results/schematic-grounded-closure-gate-rerun-cedc5c3.json','w').write(json.dumps(result,indent=2,sort_keys=True))
          print(json.dumps(result,indent=2))
          if not result['gate']['pass']:
              raise SystemExit(1)
          PY
      - name: Persist result on disposable rerun branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add submissions/mathgraph/solver.py experiments/mathgraph/results/schematic-grounded-closure-gate-rerun-cedc5c3.json || true
          git commit -m 'research: persist cedc5c3 schematic closure rerun [skip ci]' || true
          git push origin HEAD:mathgraph/schematic-closure-rerun-cedc5c3 || true

name: MathGraph 0158 hash seed matrix
on:
  push:
    branches: [mathgraph/behavioural-future-798-gate-20260831]
    paths: [.github/workflows/mathgraph_0158_hash_seed_matrix.yml]
jobs:
  seed:
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build candidate
        run: |
          python experiments/mathgraph/build_behavioural_future_specialist.py --base submissions/mathgraph/solver.py --output /tmp/candidate.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/candidate.py'); s=p.read_text()
          a='frontier_seconds = min(12.0, max(0.5, timeout / 40.0))'
          b='given_seconds = min(5.0, max(0.5, timeout / 80.0))'
          assert s.count(a)==1 and s.count(b)==1
          p.write_text(s.replace(a,'frontier_seconds = 30.0').replace(b,'given_seconds = 10.0'))
          PY
          cp /tmp/candidate.py submissions/mathgraph/solver.py
          python -m py_compile submissions/mathgraph/solver.py
          rm -rf submissions/mathgraph/__pycache__
      - name: Setup judge
        env:
          SKIP_DOCKER: '1'
        run: bash scripts/setup.sh
      - name: Install proxy
        run: python -m pip install 'openai>=1,<3'
      - name: Fetch normal set
        run: |
          curl -fL --retry 3 'https://huggingface.co/datasets/SAIRfoundation/equational-theories-selected-problems/resolve/main/data/evaluation_normal.jsonl' -o /tmp/evaluation_normal.jsonl
      - name: Run 0158
        env:
          PYTHONHASHSEED: ${{ matrix.seed }}
        shell: bash
        run: |
          set -euo pipefail
          source .env.judge
          python - <<'PY'
          import json,sys,time,os
          from pathlib import Path
          ROOT=Path('.').resolve(); sys.path.insert(0,str(ROOT))
          from pipeline.proxy import load_config,load_problems,run_solver
          rows={r['id']:r for r in load_problems('/tmp/evaluation_normal.jsonl')}
          cfg=json.loads(json.dumps(load_config())); cfg['solver']['timeout_seconds']=180; cfg.setdefault('sandbox',{})['mode']='none'
          trace=[]; t=time.monotonic()
          result=run_solver(ROOT/'submissions/mathgraph',rows['evaluation_normal_0158'],cfg,trace_hook=lambda e: trace.append(e))
          judges=[x for x in trace if x.get('type')=='judge']
          out={'seed':os.environ.get('PYTHONHASHSEED'),'elapsed':round(time.monotonic()-t,3),'solved':bool(result.get('solved')),'verdict':result.get('verdict'),'judge_calls':result.get('judge_calls',0),'judge_statuses':[(x.get('response') or {}).get('status') for x in judges],'llm_calls':result.get('llm_calls',0)}
          print('HASH_SEED_0158',json.dumps(out,sort_keys=True),flush=True)
          PY

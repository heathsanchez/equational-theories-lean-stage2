name: MathGraph Given Clause Retention Policy Gate
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, edited]
jobs:
  retention:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.title == '[MathGraph Trigger] Given Clause Saturation Gate')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/developmental-continuation-20260820
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=3,<5'
      - name: Run passive-clause retention policy gate
        run: python experiments/mathgraph/run_given_clause_retention_policy_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-given-clause-retention-policy-gate
          path: experiments/mathgraph/results/given-clause-retention-policy-gate.json
          if-no-files-found: warn
          retention-days: 30
